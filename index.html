/* ==========================================================================
   角色姿态
   ========================================================================== */
var t0=performance.now();
function now(){return (performance.now()-t0)/1000;}

/* 让前手臂指向某个世界坐标（肩关节旋转）
   手臂画法：肩 (13,-101) → 拳 (18,-62)，默认方向 atan2(39,5)≈82.7°（近垂直向下）
   目标方向 base 减掉默认方向即为所需旋转量 */
var ARM_REST_DEG=82.7;
function pointArm(target){
  var sx=13, sy=-100;
  var dx=target.x-S.girlX, dy=target.y-(S.girlY+sy);
  var base=Math.atan2(dy,dx)*180/Math.PI;
  var rel=base-ARM_REST_DEG;
  return clamp(rel,-165,25);
}
/* 左臂：肩关节在 (-13,-100)，指向下方支点（真实攀岩的"副手扶点"） */
function pointArmL(target){
  var sy=-100;
  var dx=target.x-S.girlX, dy=target.y-(S.girlY+sy);
  var base=Math.atan2(dy,dx)*180/Math.PI;
  /* 左臂默认朝下偏左，镜像右臂的 rest 角 */
  var rel=base-(180-ARM_REST_DEG);
  return clamp(rel,-25,165);
}

/* 攀爬时：找上方最近、且够得到的岩点，让手真的扶上去。
   手臂画长只有约 40 单位，够不到上百单位的岩点，
   所以除了旋转方向，还要按距离做纵向拉伸，视觉上才像"伸长去够"。 */
function nearestHoldTarget(){
  var best=null,bd=1e9;
  for(var i=0;i<SLOTS.length;i++){
    var sl=SLOTS[i];
    var dy=sl.y-S.girlY;          /* 世界 y 越小越高，故上方为负 */
    if(dy>26)continue;            /* 已在下方或同高 */
    if(dy<-190)continue;          /* 太高够不到 */
    var dx=sl.x-S.girlX;
    var d=Math.abs(dy)*1.15+Math.abs(dx);   /* 纵向权重更高，优先够高处 */
    if(d<bd){bd=d;best=sl;}
  }
  if(!best)best=GOAL;
  return best;
}
/* 攀岩时副手扶的"下方支点"：已抓到、且在女生下方的岩点里挑最近的一个。
   这样主手抓上方、副手扶下方，形成三点固定的真实攀岩姿态。 */
function nearestSupport(){
  var done=S.stepDone-1;
  if(done>=0&&done<SLOTS.length){
    var sl=SLOTS[done];
    if(sl.y>S.girlY+20)return sl;   /* 世界 y 更大 = 更靠下 */
  }
  /* 还没抓到第一个时，用稍低于当前站位的虚拟支点让手臂自然下扶 */
  return {x:S.girlX-26,y:S.girlY+54};
}
/* 手臂纵向拉伸倍率：够近时 1，越远拉得越长（上限 1.9，勿过头） */
function armStretch(target){
  var sy=-100;
  var dy=Math.abs(target.y-(S.girlY+sy)), dx=Math.abs(target.x-S.girlX);
  var dist=Math.sqrt(dx*dx+dy*dy);
  return clamp(1+(dist-46)/190,1,1.9);
}

function updateGirl(dt){
  S.poseT+=dt;
  /* girlRun 让女孩独立跑动（砸墙后段进场），不把 S.pose 改成 run —— 否则猫也会跟着跑 */
  var t=now(), pose=(S.girlRun?"run":S.pose);
  var bob=1+Math.sin(t*2.4)*0.015;
  var dy=0,rot=0;

  /* 舞动：全身上下弹 + 手臂交替 + 头发甩动 */
  if(pose==="dance"){
    var beat=t*Math.PI*2*2.28;          /* ≈ 每拍 0.44s */
    dy=-Math.abs(Math.sin(beat))*7;
    rot=Math.sin(beat)*4.5;
    var a1=20+Math.sin(beat)*44, a2=14-Math.sin(beat)*38;
    G.armR.setAttribute("transform","rotate("+a1.toFixed(1)+" 13 -100)");
    G.armL.setAttribute("transform","rotate("+a2.toFixed(1)+" -13 -100)");
    G.legL.setAttribute("transform","rotate("+(-4+Math.sin(beat)*16).toFixed(1)+" -6 -58)");
    G.legR.setAttribute("transform","rotate("+(4-Math.sin(beat)*16).toFixed(1)+" 6 -58)");
    /* 头部已由 buildGirl 定位到 (0,-124)，这里只绕头心做自身旋转 */
    G.headTilt.setAttribute("transform","translate(0,"+(-Math.abs(Math.sin(beat))*2).toFixed(2)+") rotate("+
      (Math.sin(beat)*5).toFixed(1)+")");
    G.hairBack.setAttribute("transform","rotate("+(-Math.sin(beat)*7).toFixed(1)+" 0 -100)");
  }
  else if(pose==="climb"){
    /* 真实攀岩动作：以 3.1 秒为一个"伸手→抓握→蹬腿收身"循环，
       身体贴近墙面、随发力左右摆重心，手脚分置抓不同支点。 */
    var cyc=(t*0.32)%1;                    /* 0..1 的攀爬循环 */
    var reach=Math.sin(cyc*Math.PI*2-0.6); /* 伸手(+)/收身(-) */
    var w=Math.sin(t*2.6);                 /* 重心左右摆（慢） */
    var leg=Math.sin(t*2.6+Math.PI);       /* 双腿反相蹬踏 */
    dy=-Math.abs(Math.sin(t*5.2))*2.2;     /* 发力时的细碎上下颠动 */
    rot=w*3.4;                             /* 身体贴墙侧倾 */
    var grip=S.armTarget||nearestHoldTarget();
    if(grip){
      /* 主手抓上方岩点：伸出时手臂拉长，抓住后收回 */
      var st=clamp(armStretch(grip)+reach*0.18,1,2.1);
      G.armR.setAttribute("transform","rotate("+pointArm(grip).toFixed(1)+" 13 -100) scale(1,"+st.toFixed(2)+")");
      /* 副手扶住刚才抓住的下方岩点——三点固定，更像真实攀岩 */
      var below=nearestSupport();
      if(below){
        G.armL.setAttribute("transform","rotate("+pointArmL(below).toFixed(1)+
          " -13 -100) scale(1,"+clamp(armStretch(below),1,1.6).toFixed(2)+")");
      }else{
        G.armL.setAttribute("transform","rotate("+(146+reach*16).toFixed(1)+" -13 -100) scale(1,1.5)");
      }
    }else{
      G.armR.setAttribute("transform","rotate("+(150+reach*16).toFixed(1)+" 13 -100)");
      G.armL.setAttribute("transform","rotate("+(138-reach*14).toFixed(1)+" -13 -100)");
    }
    /* 蹬腿：一腿屈膝踩实下方支点、一腿伸展够下一脚，反相交替 */
    G.legL.setAttribute("transform","rotate("+(30+leg*13).toFixed(1)+" -6 -58)");
    G.legR.setAttribute("transform","rotate("+(-8-leg*11).toFixed(1)+" 6 -58)");
    G.headTilt.setAttribute("transform","rotate("+(w*4-2).toFixed(1)+")");
    G.hairBack.setAttribute("transform","rotate("+(-8-w*6).toFixed(1)+" 0 -100)");
  }
  else if(pose==="slip"){
    var j=Math.sin(t*24)*6;
    dy=-j;
    G.armR.setAttribute("transform","rotate("+(100+j*3).toFixed(1)+" 13 -100)");
    G.armL.setAttribute("transform","rotate("+(90-j*3).toFixed(1)+" -13 -100)");
    G.legL.setAttribute("transform","rotate("+(26+j).toFixed(1)+" -6 -58)");
    G.legR.setAttribute("transform","rotate("+(-24+j).toFixed(1)+" 6 -58)");
    G.headTilt.setAttribute("transform","rotate("+j.toFixed(1)+")");
    G.hairBack.setAttribute("transform","rotate("+(10+j).toFixed(1)+" 0 -100)");
  }
  else if(pose==="punchGirl"){
    /* 手臂角度由序列控制，这里只补身体前倾 */
    rot=-5;dy=-4;
    G.legL.setAttribute("transform","rotate(-16 -6 -58)");
    G.legR.setAttribute("transform","rotate(14 6 -58)");
    G.headTilt.setAttribute("transform","rotate(-4)");
  }
  else if(pose==="run"){
    /* 跟着猫跑：身体前倾，双臂双腿反相摆动，步频偏快 */
    var rp=t*13;
    rot=-11;dy=-Math.abs(Math.sin(rp))*7;
    G.armR.setAttribute("transform","rotate("+(-24+Math.sin(rp)*30).toFixed(1)+" 13 -100)");
    G.armL.setAttribute("transform","rotate("+(24-Math.sin(rp)*30).toFixed(1)+" -13 -100)");
    G.legL.setAttribute("transform","rotate("+(-6+Math.sin(rp)*24).toFixed(1)+" -6 -58)");
    G.legR.setAttribute("transform","rotate("+(6-Math.sin(rp)*24).toFixed(1)+" 6 -58)");
    G.headTilt.setAttribute("transform","rotate(-5)");
    G.hairBack.setAttribute("transform","rotate(12 0 -100)");
  }
  else if(pose==="sew"){
    /* 坐在缝纫机前：身体前倾低头看针，双手在台面推布，脚踏板上下 */
    var sew=S.sewStage===3, push=sew?Math.sin(t*16)*9:Math.sin(t*3)*3;
    rot=6;dy=-2;
    G.armR.setAttribute("transform","rotate("+(46+push).toFixed(1)+" 13 -100)");
    G.armL.setAttribute("transform","rotate("+(38-push*0.6).toFixed(1)+" -13 -100)");
    G.legL.setAttribute("transform","rotate("+(sew?-6-Math.sin(t*16)*10:-6).toFixed(1)+" -6 -58)");
    G.legR.setAttribute("transform","rotate("+(sew?10+Math.sin(t*16)*10:8).toFixed(1)+" 6 -58)");
    G.headTilt.setAttribute("transform","rotate(9)");
    G.hairBack.setAttribute("transform","rotate(-4 0 -100)");
  }
  else if(pose==="handoff"){
    /* 递信给小猫：右臂朝左前方平伸（猫在女孩左侧）、身体微前倾、低头看信。
       右臂默认朝下 14°，向左平伸约 -78°；左手在胸前托着信尾。 */
    rot=-6;dy=-2;
    G.armR.setAttribute("transform","rotate(-78 13 -100)");
    G.armL.setAttribute("transform","rotate("+(46+Math.sin(t*2)*3).toFixed(1)+" -13 -100)");
    G.legL.setAttribute("transform","rotate(-5 -6 -58)");
    G.legR.setAttribute("transform","rotate(5 6 -58)");
    G.headTilt.setAttribute("transform","rotate(7)");
    G.hairBack.setAttribute("transform","rotate(-5 0 -100)");
  }
  else if(S.armTarget){
    /* 装岩点时伸手够向目标 */
    var ang=pointArm(S.armTarget);
    G.armR.setAttribute("transform","rotate("+ang.toFixed(1)+" 13 -100)");
    G.armL.setAttribute("transform","rotate("+(16+Math.sin(t*3)*5).toFixed(1)+" -13 -100)");
    G.legL.setAttribute("transform","rotate(-6 -6 -58)");
    G.legR.setAttribute("transform","rotate(7 6 -58)");
    G.headTilt.setAttribute("transform","rotate(-3)");
    G.hairBack.setAttribute("transform","rotate(-4 0 -100)");
  }
  else{
    /* 站立 / 行走：呼吸 + 偶尔眨眼 */
    G.armR.setAttribute("transform","rotate("+(14+Math.sin(t*2.4)*4).toFixed(1)+" 13 -100)");
    G.armL.setAttribute("transform","rotate("+(20+Math.sin(t*2.4+1)*4).toFixed(1)+" -13 -100)");
    G.legL.setAttribute("transform","rotate(-4 -6 -58)");
    G.legR.setAttribute("transform","rotate(4 6 -58)");
    /* 眨眼：只在峰值瞬间快速压扁一下（sin^24 脉冲约 0.2s），
       旧写法 |sin(t*0.85)| 让头部一半时间都处于压扁状态，看着像头被踩瘪 */
    var blink=Math.pow(Math.max(0,Math.sin(t*0.85)),24);
    var hd=1-0.88*blink;
    G.headTilt.setAttribute("transform","translate(0,"+(blink*4.4).toFixed(2)+") scale(1,"+hd.toFixed(3)+")");
    G.hairBack.setAttribute("transform","rotate("+(Math.sin(t*2.2)*3).toFixed(1)+" 0 -100)");
  }
  girlG.setAttribute("transform","translate("+S.girlX.toFixed(2)+","+
    (S.girlY+dy).toFixed(2)+") scale("+bob.toFixed(3)+",1) rotate("+rot.toFixed(1)+")");
}

function updateCat(dt){
  if(!S.catVisible){catG.setAttribute("display","none");return;}
  catG.removeAttribute("display");
  /* 淡入淡出：猫砸完墙后淡出消失，探出来时淡入 */
  catG.setAttribute("opacity",clamp(S.catFade,0,1).toFixed(3));
  var t=now(),pose=S.pose;
  var bob=1+Math.sin(t*2.6)*0.02;
  var dy=0,rot=0;
  C.tail.setAttribute("transform","rotate("+(Math.sin(t*2.6)*17).toFixed(1)+" 19 -48)");

  /* 灯幕睡觉：专门的蜷缩睡猫做轻微呼吸起伏；站立猫此时是隐藏的 */
  if(S.act===LAMP&&(S.lampPhase==="wait"||S.lampPhase==="wake")){
    if(sleepG){
      var br=1+Math.sin(t*1.8)*0.025;
      sleepG.setAttribute("transform","translate("+LAMP_CAT_SLEEP_X+","+GROUND+") scale(1,"+br.toFixed(3)+")");
    }
    return;
  }
  if(pose==="dance"){
    var beat=t*Math.PI*2*2.28;
    dy=-Math.abs(Math.sin(beat+0.5))*6;
    rot=Math.sin(beat+0.5)*5;
    C.armF.setAttribute("transform","rotate("+(22+Math.sin(beat+1)*40).toFixed(1)+" 13 -56)");
    C.armB.setAttribute("transform","rotate("+(16-Math.sin(beat+1)*34).toFixed(1)+" -11 -56)");
    /* 头部只做自身旋转（绕头心 0,0），不再重复位移 */
    C.headTilt.setAttribute("transform","rotate("+(Math.sin(beat+0.5)*7).toFixed(1)+")");
  }
  else if(pose==="punchCat"){
    rot=-6;dy=-5;
    C.headTilt.setAttribute("transform","rotate(-5)");
  }
  else if(pose==="run"){
    /* 跑动：身体前倾，四肢交替摆动 */
    var rp=t*13;
    rot=-13;dy=-Math.abs(Math.sin(rp))*7;
    C.armF.setAttribute("transform","rotate("+(-26+Math.sin(rp)*30).toFixed(1)+" 13 -56)");
    C.armB.setAttribute("transform","rotate("+(30-Math.sin(rp)*30).toFixed(1)+" -11 -56)");
    C.headTilt.setAttribute("transform","rotate(-6)");
    C.tail.setAttribute("transform","rotate("+(20+Math.sin(rp)*22).toFixed(1)+" 19 -48)");
  }
  else{
    C.armF.setAttribute("transform","rotate("+(14+Math.sin(t*2.6)*4).toFixed(1)+" 13 -56)");
    C.armB.setAttribute("transform","rotate("+(18+Math.sin(t*2.6+1)*4).toFixed(1)+" -11 -56)");
    /* 与 index-v5 原版一致：头部 |sin| 一鼓一鼓伸缩（周期约 2.85 秒），
       压缩量同步带动头顶轻轻点动（位移 ×4），无下限。 */
    var hd=Math.abs(Math.sin(t*1.1));
    C.headTilt.setAttribute("transform","translate(0,"+((1-hd)*4).toFixed(2)+") scale(1,"+hd.toFixed(3)+")");
  }
  /* 旋转中心取猫的身体中心 (0,-48)，否则绕原点转会甩飞头部。
     跑动阶段保留一点纵向压缩（bsc<1），让从"蜷缩睡觉"起身后的身形仍紧凑，
     不会因 scale 突然从 0.72 弹回 1 而出现头身拉开；退出灯幕后自动恢复为 1。 */
  var bsc=(S.act===LAMP&&pose==="run")?0.82:1;
  catG.setAttribute("transform","translate("+S.catX.toFixed(2)+","+
    (S.catY+dy).toFixed(2)+") scale("+S.catFace+","+bob.toFixed(3)+")");
  C.body.setAttribute("transform","translate(0,"+(-dy).toFixed(2)+") rotate("+rot.toFixed(1)+" 0 -48) scale(1,"+bsc.toFixed(2)+")");
}

/* ==========================================================================
   主循环
   ========================================================================== */
/* 近景：以「一人一猫的中点」为焦点，两人都留在画面内 */
function closeFocusX(){
  if(S.act===DANCE||S.act===IDLE)return S.girlX;
  return (S.girlX+S.catX)/2;
}
function step(dt,ts){
  var climbing=(S.act===CLIMB||S.act===FAIL);
  if(climbing){
    /* 相机横向只跟一部分：中心锚在墙中线，叠加女孩相对中线的位移的一部分。
       这样女孩在不同岩点间左右腾挪时，屏幕上会真的左右移动，
       而不是被相机完全抵消、永远钉在画面中央。 */
    var focusX=200+(S.girlX-200)*CLIMB_FOLLOW;
    cam.tk=1;cam.tx=200-focusX;
    /* 第一段攀爬时女生离画面底部的距离与安装幕保持一致（地面锚点约 0.94 屏高），
       不再空出一大片下半屏；越接近顶部越平滑过渡到原来的 470 锚点，
       否则终点会被顶到画面最下缘。 */
    var lowY=SLOTS[0].y, topY=WIN_Y;
    var climbP=clamp((lowY-S.girlY)/(lowY-topY),0,1);
    var anchor=lerp(VIEW_H*0.94,470,easeInOut(climbP));
    cam.ty=clamp(anchor-S.girlY,-(GROUND-WIN_Y+40),VIEW_H*0.94);
  }else if(S.act===WIN){
    /* 结局镜头已固定，保持猫推蛋糕进场的画面 */
  }else if(S.act===SHOWBOW){
    /* 领结特写：拉近到猫脖子，领结占据画面中心 */
    aimAfter(2.05,S.catX,0.5,S.catY-40);
  }else if(S.act===SEW||S.act===WEAR||S.act===PARADE||S.act===WISH){
    aimAfter(1.05,GOAL.x+70,0.72,GOAL.y);
  }else if(S.act===REVISIT){
    /* 回访在灯幕背景里：镜头与开场拍灯一致，灯与猫都在画面中下部 */
    cam.tk=INTRO_K;cam.tx=200-LAMP_X*INTRO_K;cam.ty=VIEW_H*0.84-GROUND*INTRO_K;
  }else if(S.act===NOTES){
    aimAfter(0.9,GOAL.x+12,0.6,GOAL.y);
  }else if(S.act===STORY){
    if(S.phase==="place"||S.phase==="transition"){
      /* 安装全程：整面墙全景，女生站在地面操作脚边岩点筐。 */
      cam.tk=OV_K;
      cam.tx=200-GIRL_HOME.x*OV_K;
      cam.ty=VIEW_H*0.94-GROUND*OV_K;
    }else{
      /* 攀爬任务：女生已经到达岩点，镜头才升到对应高度。 */
      cam.tk=STORY_K;
      cam.tx=200-(S.girlX+100)*STORY_K;
      cam.ty=VIEW_H*0.66-S.girlY*STORY_K;
    }
  }else if(S.act===LAMP){
    /* 黑底开场镜头：灯居中、放大到足够看清睡猫；灯座落在画面约 84% 高处。
       猫跑开、女孩追都在画面内/外自然发生，镜头全程锁定这盏灯。 */
    cam.tk=INTRO_K;
    cam.ty=VIEW_H*0.84-GROUND*INTRO_K;
    cam.tx=200-LAMP_X*INTRO_K;
  }else if(S.act===DANCE||S.act===CATIN||S.act===DUET){
    /* 近景：跳舞/齐舞要看清角色。
       同样按 VIEW_H 比例锚定，别用写死的 CLOSE_Y（viewBox 一变高就出画）。 */
    cam.tk=CLOSE_K;
    cam.ty=VIEW_H*0.70-GROUND*CLOSE_K;
    cam.tx=200-closeFocusX()*CLOSE_K;
  }else if(S.act===PUNCH){
    /* 出拳时拉远到全景，对准墙中心：猫砸墙、女孩后段跑进来都在画内。
       不再跟 girlX（她开场远在场外，会带偏镜头）。
       锚点按 VIEW_H 比例：viewBox 高度随视口变化，写死 OV_Y 会让
       地面落到画面外。0.94 屏高 → 地面贴近下缘、下方留白更少，墙顶凹陷仍完整可见。 */
    cam.tk=OV_K;
    cam.ty=VIEW_H*0.94-GROUND*OV_K;
    cam.tx=200-200*OV_K;
  }else{
    cam.tk=OV_K;
    cam.ty=VIEW_H*0.94-GROUND*OV_K;
    cam.tx=200-S.girlX*OV_K;
  }
  var sp=1-Math.pow(0.0016,dt);
  cam.k=lerp(cam.k,cam.tk,sp);cam.x=lerp(cam.x,cam.tx,sp);cam.y=lerp(cam.y,cam.ty,sp);

  var ox=0,oy=0;
  if(shakeT>0){shakeT-=dt;ox=(Math.random()-.5)*shakeA*2;oy=(Math.random()-.5)*shakeA*2;shakeA*=0.9;}
  camG.setAttribute("transform","translate("+(cam.x+ox).toFixed(2)+","+(cam.y+oy).toFixed(2)+") scale("+cam.k.toFixed(4)+")");

  if(S.act===LAMP)updateLamp(dt);
  if(S.act===IDLE||S.act===DANCE||S.act===CATIN||S.act===DUET||S.act===PUNCH)updateStory(dt);
  if(S.act===STORY)updateStoryStage(dt);
  /* 岩点筐跟着女生：她往上一个岩点，整排岩点跟着上去 */
  if(S.act===STORY)followTray();
  if(S.act===CLIMB)updateClimb(dt);
  if(S.act===SEW)updateSewFinal(dt);
  if(S.act===WEAR){updateWear(dt);if(!S.bowPlaced)updateBow(dt);}
  if(S.act===SHOWBOW)updateShowBow(dt);
  if(S.act===PARADE)updateParade(dt);
  if(S.act===WISH){
    if(S.wishPhase==="give")updateWishGive(dt);
    else if(S.wishPhase==="back")updateWishBack(dt);
  }
  if(S.act===REVISIT)updateRevisit(dt);

  updateGirl(dt);
  updateCat(dt);

  if(S.act===CLIMB){
    var halo=$("goalHalo");
    if(halo){
      var b=1+Math.sin(ts/240)*0.1;
      halo.setAttribute("rx",(82*b).toFixed(1));
      halo.setAttribute("ry",(44*b).toFixed(1));
    }
    var fc=$("flagCloth");
    if(fc)fc.setAttribute("transform","skewX("+(Math.sin(ts/300)*4).toFixed(2)+")");
  }
  fxLoop(dt);
}

var last=0;
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  step(dt,ts);
  requestAnimationFrame(loop);
}

/* ==========================================================================
   启动
   ========================================================================== */
function start(){
  build();
  resize();
  S.girlX=GIRL_HOME.x;S.girlY=GIRL_HOME.y;
  S.catX=560;S.catY=GROUND;
  /* 开始页面 = 黑底灯幕：相机初始就锁定开场镜头，第一帧不闪出墙 */
  cam.tk=INTRO_K;cam.ty=VIEW_H*0.84-GROUND*INTRO_K;cam.tx=200-LAMP_X*INTRO_K;
  cam.k=cam.tk;cam.x=cam.tx;cam.y=cam.ty;
  startLamp();
  requestAnimationFrame(loop);
}
var st=document.createElement("style");
st.textContent="@keyframes flick{from{transform:scaleY(.85);opacity:.85}to{transform:scaleY(1.14);opacity:1}}"+
  "@keyframes bobY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}";
document.head.appendChild(st);

/* 调试钩子：把内部状态挂到 window，方便控制台调试与自动化验证 */
window.__cat={
  get state(){return S;}, get cam(){return cam;},
  SLOTS:SLOTS, TYPES:TYPES, WIN_Y:WIN_Y, GOAL:GOAL,
  ACT:{IDLE:IDLE,DANCE:DANCE,CATIN:CATIN,DUET:DUET,PUNCH:PUNCH,STORY:STORY,CLIMB:CLIMB,WIN:WIN,FAIL:FAIL,
       SEW:SEW,WEAR:WEAR,NOTES:NOTES,PARADE:PARADE,LAMP:LAMP,SHOWBOW:SHOWBOW,WISH:WISH,REVISIT:REVISIT},
  wishPhase:function(){return S.wishPhase;},
  revisitPhase:function(){return S.revisitPhase;},
  /* 缝纫分步钩子 */
  sewStage:function(){return S.sewStage;},
  /* 灯幕测试钩子 */
  lampLevel:function(){return S.lampLevel;},
  lampPhase:function(){return S.lampPhase;},
  tapLamp:function(){tapLamp();},
  lampPt:function(){
    var r=scene.getBoundingClientRect();
    var vb=scene.getAttribute("viewBox").split(/\s+/).map(Number);
    var s=Math.min(r.width/vb[2],r.height/vb[3]);
    var ox=(r.width-vb[2]*s)/2,oy=(r.height-vb[3]*s)/2;
    var rt=(root.getAttribute("transform")||"").match(/translate\(([-\d.]+)/);
    var rx=rt?parseFloat(rt[1]):0;
    return {x:(LAMP_X*cam.k+cam.x+rx)*s+ox+r.left,y:(LAMP_LIGHT_Y*cam.k+cam.y)*s+oy+r.top};
  },
  BDAY:BDAY, FULL_SONG:FULL_SONG, BLESSINGS:BLESSINGS,
  noteSlots:function(){return noteSlots;}, notePieces:function(){return notePieces;},
  blessingCount:function(){return camG?camG.querySelectorAll("g[data-bless]").length:0;},
  showBlessingAt:function(i,x,y){showBlessing(i,x,y);},
  STEP:{WAND:STEP_WAND,SEW:STEP_SEW,SHOOT:STEP_SHOOT,BOWTIE:STEP_BOWTIE,RED:STEP_RED},
  /* 测试辅助：五个岩点已装好，直接跳到攀爬途中「已抓到前 n 个」的状态。
     n 为已抓数量（0..5）；任务关卡已停用，不再 enterStep。 */
  gotoStep:function(n){
    n=clamp(n,0,SLOTS.length);
    startStory();
    holdG.innerHTML="";
    dents.forEach(function(d){d.filled=false;d.fillNode=null;d.hint.style.transition="none";d.hint.setAttribute("opacity",".55");});
    trayG.innerHTML="";buildTray();S.placed=0;
    for(var i=0;i<SLOTS.length;i++){
      var node=trayNodesOf().find(function(x){return x.__type===SLOTS[i].t;});
      fillSlot(i,node);
    }
    S.act=CLIMB;S.phase="climb";S.stepDone=n;S.timeLeft=HOLD_TIME;
    S.climbElapsed=0;
    $("tnum").textContent="0.00";
    $("barIn").style.width="0%";
    SLOTS.forEach(function(s,i){s._got=i<n;});
    if(n>0){S.girlY=climbHoldY(n-1);S.girlX=climbHoldX(n-1);}
    else{S.girlY=GROUND;S.girlX=206;}
    S.climbTarget=-1;S.climbGoal=false;S.reached=false;
    cam.tk=1;
  },
  /* 测试辅助：跳到第 n 个岩点的安装阶段，前 n 个已装好。 */
  gotoPlace:function(n){
    n=clamp(n,0,SLOTS.length-1);
    startStory();
    holdG.innerHTML="";
    dents.forEach(function(d){d.filled=false;d.fillNode=null;d.hint.style.transition="none";d.hint.setAttribute("opacity",".55");});
    trayG.innerHTML="";buildTray();S.placed=0;
    for(var i=0;i<n;i++){
      var node=trayNodesOf().find(function(x){return x.__type===SLOTS[i].t;});
      fillSlot(i,node);
    }
    S.stepDone=0;
    enterPlacement(n);
  },
  /* 测试辅助：安装阶段本就 pickReady=1，保留此接口兼容旧测试。 */
  ready:function(){ if(S.phase==="place")S.pickReady=1; },
  /* 测试辅助：直接完成当前攀爬任务（jsdom 无真实布局，坐标不可靠）。
     完成后从该岩点上方继续攀爬，不重装岩点、不重置倒计时。 */
  doStep:function(){
    if(S.act!==STORY||S.phase!=="story")return null;
    if(S.step===STEP_WAND){S.wandHits=3;completeStep();return 'wand';}
    if(S.step===STEP_SEW){S.sewProg=1;completeStep();return 'sew';}
    if(S.step===STEP_SHOOT){
      S.shootShots=S.shootSlots.length;
      S.shootScore=S.shootSlots.length;
      if(STORY_PROPS.score)STORY_PROPS.score.textContent=S.shootScore+" / 3";
      completeStep();return 'shoot';
    }
    if(S.step===STEP_BOWTIE){S.bowPlaced=true;completeStep();return 'bow';}
    if(S.step===STEP_RED){S.redPress=1;completeStep();return 'red';}
    return null;
  },
  /* 测试辅助：等价于点击第 n 个墙上岩点 / 红色终点。 */
  grab:function(n){beginClimbMove(n);},
  grabGoal:function(){beginGoalMove();},
  /* 测试辅助：第一步——按形状选中岩点（等价于点到脚边那个岩点） */
  tapHold:function(type){
    var n=[...trayG.children].find(function(x){return x.__type===type;});
    if(n)tapTrayHold(n);
    return !!n;
  },
  /* 测试辅助：第二步——点墙上第 idx 个凹槽完成配对 */
  tapDent:function(idx){ tapDent(idx); },
  /* 测试辅助：一步到位（选中+配对到形状匹配的凹槽），供旧测试兼容 */
  installHold:function(type){
    var n=[...trayG.children].find(function(x){return x.__type===type;});
    if(!n)return false;
    tapTrayHold(n);
    var idx=dents.findIndex(function(d){return !d.filled&&d.t===type;});
    if(idx>=0)tapDent(idx);
    return idx>=0;
  },
  /* 测试辅助：当前选中岩点 / 凹槽世界坐标（供真实鼠标点击墙上凹槽） */
  selected:function(){return S.selType;},
  dentPt:function(idx){
    var d=dents[idx];if(!d)return null;
    var r=document.getElementById('scene').getBoundingClientRect();
    var vb=document.getElementById('scene').getAttribute('viewBox').split(/\s+/).map(Number);
    var s=Math.min(r.width/vb[2],r.height/vb[3]);
    var ox=(r.width-vb[2]*s)/2,oy=(r.height-vb[3]*s)/2;
    var rt=(document.getElementById('root').getAttribute('transform')||'').match(/translate\(([-\d.]+)/);
    var rx=rt?parseFloat(rt[1]):0;
    return {x:(d.x*cam.k+cam.x+rx)*s+ox+r.left,y:(d.y*cam.k+cam.y)*s+oy+r.top};
  },
  /* 测试辅助：脚边某个岩点的屏幕坐标（供真实鼠标点击） */
  trayPt:function(type){
    var n=[...trayG.children].find(function(x){return x.__type===type;});
    if(!n)return null;
    var r=n.getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.top+r.height/2};
  },
  /* 登顶后章节测试钩子：道具屏幕坐标（真实鼠标点击用）/ 直接推进（jsdom 用） */
  afterPt:function(k){
    var p=null,m;
    if(k==="fabric")p=fabricPt();
    else if(k==="machine")p=sewMachinePt();
    else if(k==="pedal")p=pedalPt();
    else if(k==="catNeck")p={x:S.catX,y:S.catY-56};
    else{
      m=/^notePiece(\d+)$/.exec(k||"");
      if(m&&notePieces[+m[1]])p={x:notePieces[+m[1]].x,y:notePieces[+m[1]].y};
      else{
        m=/^noteSlot(\d+)$/.exec(k||"");
        if(m&&noteSlots[+m[1]])p={x:noteSlots[+m[1]].x,y:noteSlots[+m[1]].y};
      }
    }
    if(!p)return null;
    var r=scene.getBoundingClientRect();
    var vb=scene.getAttribute("viewBox").split(/\s+/).map(Number);
    var s=Math.min(r.width/vb[2],r.height/vb[3]);
    var ox=(r.width-vb[2]*s)/2,oy=(r.height-vb[3]*s)/2;
    var rt=(root.getAttribute("transform")||"").match(/translate\(([-\d.]+)/);
    var rx=rt?parseFloat(rt[1]):0;
    return {x:(p.x*cam.k+cam.x+rx)*s+ox+r.left,y:(p.y*cam.k+cam.y)*s+oy+r.top};
  },
  afterDo:function(action){
    if(action==="sew"&&S.act===SEW){finishSew();return true;}
    if(action==="wear"&&S.act===WEAR){finishWear();return true;}
    if(action==="notes"&&S.act===NOTES){
      S.musicPlaying=false;
      notePieces.forEach(function(n){n.placed=true;n.node.setAttribute("opacity","0");});
      noteSlots.forEach(function(n){n.filled=true;n.node.setAttribute("opacity","0.22");});
      S.notesPlaced=BDAY.length;
      playBirthday();return true;
    }
    if(action==="parade"&&S.act===PARADE){S.paradeT=3.6;updateParade(0);return true;}
    /* 登顶尾声：递信 → 许愿 → 吹烛 → 结算 */
    if(action==="give"&&S.act===WISH&&S.wishPhase==="give"){S.wishT=2.1;updateWishGive(0);return true;}
    if(action==="open"&&S.act===WISH&&(S.wishPhase==="offer"||S.wishPhase==="writing")){openWishPanel();return true;}
    if(action==="wish"&&S.act===WISH){
      commitWish("text","愿你天天开心", "");return true;
    }
    if(action==="wishAudio"&&S.act===WISH){
      commitWish("audio","","data:audio/webm;base64,TEST");return true;
    }
    if(action==="back"&&S.act===WISH&&S.wishPhase==="back"){S.wishT=1.5;updateWishBack(0);return true;}
    if(action==="blow"&&S.act===WISH&&S.wishPhase==="blow"){
      var f0=$("wishFlame0"),f1=$("wishFlame1");
      if(f0)f0.style.display="none";
      if(f1)f1.style.display="none";
      blowWishCandle(2);      /* 最后一支触发结算 */
      return true;
    }
    /* 二次进入：猫带信 → 关上的信 → 打开 → 保留/重许 → 睡觉 */
    if(action==="revisit"){startRevisit();return true;}
    if(action==="revisitEntered"&&S.act===REVISIT&&S.revisitPhase==="enter"){S.revisitT=2.1;updateRevisit(0);return true;}
    if(action==="envOpen"&&S.act===REVISIT&&S.revisitPhase==="sealed"){openRevisitLetter();return true;}
    if(action==="revisitKeep"&&S.act===REVISIT&&S.revisitPhase==="view"){closeRevisit(true);return true;}
    if(action==="revisitNew"&&S.act===REVISIT&&S.revisitPhase==="view"){closeRevisit(false);return true;}
    if(action==="envNew"&&S.act===REVISIT&&S.revisitPhase==="sealed"){closeRevisit(false);return true;}
    if(action==="revisitSleep"&&S.act===REVISIT&&S.revisitPhase==="sleep"){S.revisitT=2.1;updateRevisit(0);return true;}
    return false;
  },
  savedWish:function(){return loadWish();},
  clearWish:function(){try{localStorage.removeItem(WISH_KEY);}catch(e){}},
  candlePt:function(i){
    var p=wishCandleWorld(i),r=scene.getBoundingClientRect();
    var vb=scene.getAttribute("viewBox").split(/\s+/).map(Number);
    var s=Math.min(r.width/vb[2],r.height/vb[3]);
    var ox=(r.width-vb[2]*s)/2,oy=(r.height-vb[3]*s)/2;
    var rt=(root.getAttribute("transform")||"").match(/translate\(([-\d.]+)/);
    var rx=rt?parseFloat(rt[1]):0;
    return {x:(p.x*cam.k+cam.x+rx)*s+ox+r.left,y:(p.y*cam.k+cam.y)*s+oy+r.top};
  },
  envelopePt:function(){
    var p=envelopeTo(),r=scene.getBoundingClientRect();
    var vb=scene.getAttribute("viewBox").split(/\s+/).map(Number);
    var s=Math.min(r.width/vb[2],r.height/vb[3]);
    var ox=(r.width-vb[2]*s)/2,oy=(r.height-vb[3]*s)/2;
    var rt=(root.getAttribute("transform")||"").match(/translate\(([-\d.]+)/);
    var rx=rt?parseFloat(rt[1]):0;
    return {x:(p.x*cam.k+cam.x+rx)*s+ox+r.left,y:(p.y*cam.k+cam.y)*s+oy+r.top};
  },
  candleCount:function(){
    var n=0;for(var i=0;i<3;i++){var f=$("wishFlame"+i);if(f&&f.style.display!=="none")n++;}
    return n;
  },
  dents:function(){return dents;}, tray:function(){return trayNodesOf();},
  buildHold:buildHold,
  /* 调试：坐标系换算探针 */
  probe:function(cx,cy){
    var p=svgPt({clientX:cx,clientY:cy});
    return {svgPt:p, clientRootPt:clientRootPt(cx,cy), bowPos:S.bowPos,
            rootTf:root.getAttribute("transform"), cam:{x:cam.x,y:cam.y,k:cam.k}};
  },
  skip:function(){
    if(S.act===DANCE)startCatIn();
    else if(S.act===CATIN||S.act===DUET){S.catX=CAT_HOME.x;startPunch();}
  }
};
function trayNodesOf(){return [].slice.call(trayG.children).filter(function(n){return n.__type;});}

if(document.readyState==="complete")start();
else window.addEventListener("load",start);

})();
</script>
</body>
