<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>生日快乐 · 攀岩之约</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 全局圆润卡通字体：顶部提示条、点击引导、Toast、所有面板文字与按钮统一走这套字体，
     与墙上攀岩祝福语同一字体栈，整体更软萌、贴合插画画风。 */
  :root{--round-font:'Comic Sans MS','Yuanti SC','幼圆','Microsoft YaHei','PingFang SC',system-ui,sans-serif}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0a16;
    font-family:var(--round-font);
    color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  /* SVG 里未单独指定字体的提示文字（音名、分数、音符标签）也用圆体；
     已显式设置 font-family 的祝福语/音符符号保持原样。 */
  #scene text:not([font-family]){font-family:var(--round-font)}
  #stage{position:relative;width:100%;height:100dvh;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 6%,#1b1430 0%,#0d0a16 62%);
    transition:background .5s ease}
  /* 开场：纯黑底，只留一盏灯、一只猫、女孩的手 */
  #stage.intro{background:#05040a}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  /* 场景转场幕：登顶→阁楼时柔和地盖住硬切，避免夜空瞬间跳成室内。
     由 JS 加 .on 触发一次淡入→淡出，纯展示不接收点击。 */
  #curtain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;
    transition:opacity .72s ease;
    background:radial-gradient(120% 90% at 50% 45%,#3a2b24 0%,#171021 68%,#08060f 100%)}

  #hud{position:absolute;inset:0;pointer-events:none;z-index:5}
  /* HUD 里只有声音按钮需要接收点击；提示条/计时器/图例都是纯展示，
     必须 pointer-events:none 让点击穿透到画布，否则它们会挡住
     屏幕上方的高处岩点（玩家点不到、看起来像"点了没反应"）。 */
  #hud{pointer-events:none}
  #hud .sndBtn{pointer-events:auto}
  .topbar{position:absolute;top:0;left:0;right:0;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0;display:flex;
    flex-direction:column;gap:9px;align-items:center}
  .tip{font-size:clamp(13px,3.5vw,16px);line-height:1.5;letter-spacing:.4px;text-align:center;
    max-width:92vw;background:rgba(14,10,26,.72);border:1px solid rgba(255,255,255,.1);
    padding:7px 15px;border-radius:999px;backdrop-filter:blur(8px);
    opacity:0;transform:translateY(-10px);transition:.35s}
  .tip.on{opacity:1;transform:none}

  .timerRow{display:none;align-items:center;gap:11px}
  .timerRow.on{display:flex}
  .tnum{font-size:clamp(23px,6.4vw,29px);font-weight:800;letter-spacing:1px;min-width:76px;text-align:center;
    font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);transition:.2s}
  .tnum.low{color:#FF5C7A;animation:tpulse .5s infinite}
  @keyframes tpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  .bar{width:min(54vw,230px);height:7px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  .barIn{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#FFC24B,#FF7A5C);
    transition:width .1s linear}

  .legend{display:none;flex-wrap:nowrap;gap:4px;justify-content:center;max-width:98vw}
  .legend.on{display:flex}
  .lg{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(255,255,255,.75);
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
    padding:4px 7px;border-radius:99px;white-space:nowrap;flex:0 1 auto;min-width:0}
  .dot{width:8px;height:8px;border-radius:99px;flex:none}
  .lg b{flex:none;font-weight:500}
  .lg .en{opacity:.55;overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* 提示放在画面上方，避免压住角色（插曲折人物在 0.70 屏高处） */
  .tapHint{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);
    font-size:clamp(15px,4.4vw,19px);letter-spacing:1.2px;text-shadow:0 3px 16px rgba(0,0,0,.85);
    opacity:0;transition:.3s;text-align:center;line-height:1.8;white-space:nowrap;
    max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  .tapHint.on{opacity:1;animation:bob 1.6s ease-in-out infinite}
  /* 音符幕：五线谱在画面上部，提示改挂到下部，别压住谱面 */
  .tapHint.low{top:auto;bottom:9%}
  @keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 7px))}}

  /* 岩点筐：默认隐藏（只在装岩点幕出现），攀岩幕收起。
     只做 opacity 过渡 —— 加 translateY 会把整筐推出画布底部，
     在窄高屏上 transition 期间必然溢出屏幕。 */
  #tray{transition:opacity .3s ease;opacity:0;pointer-events:none}
  #tray.shown{opacity:1;pointer-events:auto}
  #tray.stowed{opacity:0;pointer-events:none}

  .modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,6,16,.76);backdrop-filter:blur(7px);z-index:20}
  .modal.on{display:flex;animation:fade .35s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{text-align:center;padding:28px 30px;border-radius:22px;
    background:rgba(32,25,55,.94);border:1px solid rgba(255,255,255,.13);max-width:84vw}
  .card h3{margin:0 0 9px;font-size:21px;letter-spacing:1px}
  .card p{margin:0 0 20px;font-size:13px;color:rgba(255,255,255,.62);line-height:1.8}
  .btn{pointer-events:auto;cursor:pointer;border:0;font:inherit;font-weight:700;font-size:15px;
    letter-spacing:1.5px;color:#1c1328;background:linear-gradient(135deg,#FFD36B,#FF9A5C);
    padding:13px 32px;border-radius:999px;box-shadow:0 8px 22px rgba(255,150,80,.3)}

  #end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;z-index:30;padding:24px;text-align:center;
    background:radial-gradient(120% 90% at 50% 22%,rgba(48,24,68,.9),rgba(6,4,12,.985))}
  #end.on{display:flex;animation:fadeUp .8s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  #end .kicker,#end .sub,#end .hintc{
    text-shadow:0 2px 14px rgba(6,4,12,.95),0 0 34px rgba(6,4,12,.8)}
  #end h1{position:relative;margin:0;font-size:clamp(30px,9vw,46px);letter-spacing:6px;font-weight:800;
    background:linear-gradient(180deg,#FFF3D0,#FFB35C 55%,#FF7A8F);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 20px rgba(255,150,80,.35))}
  #end h1::before{content:"生日快乐";position:absolute;inset:0;z-index:-1;
    color:rgba(6,4,12,.92);filter:blur(16px)}
  #end .kicker{font-size:11px;letter-spacing:5px;color:#FFC24B;margin-bottom:3px}
  #end .sub{margin:8px 0 2px;font-size:13px;color:rgba(255,255,255,.66);line-height:1.9}
  /* 结局里的黑猫：在蛋糕旁挥爪。独立于场景 SVG，避免被镜头裁切 */
#endCats{margin:6px 0 0;display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:11.5px;color:rgba(255,255,255,.5);letter-spacing:.5px}
  #endCats svg{width:62px;height:44px;overflow:visible}
  #endCats .paw{transform-box:view-box;transform-origin:38px 26px;
    animation:wave 1.1s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
  #cakeBox{margin:8px 0 4px;cursor:pointer}
  #end .hintc{font-size:12px;color:rgba(255,255,255,.5);min-height:18px;letter-spacing:1px}
  #end .replay{margin-top:14px}
  .sndBtn{position:absolute;top:14px;right:14px;pointer-events:auto;cursor:pointer;
    width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
  .sndBtn svg{width:17px;height:17px;fill:#fff;opacity:.85}

  /* ---- 许愿 / 回访面板 ---- */
  .wishPanel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(8,6,16,.74);backdrop-filter:blur(6px);z-index:25;padding:18px}
  .wishPanel.on{display:flex;animation:fade .32s ease both}
  .wishCard{width:100%;max-width:360px;text-align:center;padding:22px 22px 20px;border-radius:22px;
    background:linear-gradient(160deg,rgba(52,38,78,.98),rgba(30,22,50,.98));
    border:1px solid rgba(255,211,107,.28);box-shadow:0 18px 60px rgba(0,0,0,.5)}
  .wishSeal{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;
    background:linear-gradient(135deg,#FFD36B,#FF9A5C);display:flex;align-items:center;
    justify-content:center;font-size:26px;box-shadow:0 6px 18px rgba(255,150,80,.4)}
  .wishCard h3{margin:6px 0 2px;font-size:19px;letter-spacing:1px;color:#FFF3D0}
  .wishCard p{margin:0 0 14px;font-size:12px;color:rgba(255,255,255,.6)}
  .wishTabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
  .wtab{cursor:pointer;pointer-events:auto;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);font:inherit;font-size:13px;
    padding:7px 18px;border-radius:999px}
  .wtab.on{background:linear-gradient(135deg,#FFD36B,#FF9A5C);color:#241528;border-color:transparent;font-weight:700}
  #wishText{width:100%;height:96px;resize:none;box-sizing:border-box;padding:11px 12px;
    border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(10,8,20,.6);
    color:#fff;font:inherit;font-size:14px;line-height:1.6}
  #wishText:focus{outline:none;border-color:#FFC24B}
  .wishCount{text-align:right;font-size:11px;color:rgba(255,255,255,.42);margin-top:4px}
  .recBtn{cursor:pointer;pointer-events:auto;border:0;font:inherit;font-size:14px;font-weight:700;
    color:#fff;background:rgba(255,111,165,.85);padding:11px 26px;border-radius:999px}
  .recBtn.rec{background:#e8504f;animation:recPulse 1s ease-in-out infinite}
  @keyframes recPulse{0%,100%{opacity:1}50%{opacity:.55}}
  .recHint{font-size:11px;color:rgba(255,255,255,.5);margin-top:9px;min-height:16px}
  #wishAudioPlay{width:100%;margin-top:10px}
  .revisitWish{box-sizing:border-box;min-height:74px;max-height:190px;overflow:auto;text-align:left;
    padding:12px 14px;border-radius:12px;background:rgba(10,8,20,.72);
    border:1px solid rgba(255,211,107,.2);color:#FFF3D0;font-size:14px;line-height:1.7;
    margin-bottom:14px;word-break:break-word}
  /* 日期已移到标题正下方：这里只收紧标题与日期的间距，正文框再留呼吸空间 */
  #revisitPanel h3{margin-bottom:5px}
  .revisitWish #revisitBody{display:block}
  .revisitWish audio{width:100%;margin-top:6px}
  .wishActs{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .wishActs .btn{padding:11px 20px;font-size:14px}
  .btn.ghost{background:rgba(255,255,255,.1);color:#FFF3D0;border:1px solid rgba(255,255,255,.2);
    box-shadow:none}
  /* 关上的信封（回访第一步） */
  .envArt{position:relative;width:118px;height:80px;margin:4px auto 10px}
  .envArt .body{position:absolute;inset:0;border-radius:8px;
    background:linear-gradient(150deg,#FFF6DC,#F3D99B);border:2px solid #D9A441;
    box-shadow:0 10px 26px rgba(0,0,0,.4)}
  .envArt .flap{position:absolute;left:0;right:0;top:0;height:52px;border-radius:8px 8px 40% 40%;
    background:linear-gradient(160deg,#FFF1CC,#EBCD88);border:2px solid #D9A441;border-bottom:0;
    clip-path:polygon(0 0,100% 0,50% 100%)}
  .envArt .seal{position:absolute;left:50%;top:46px;transform:translateX(-50%);width:26px;height:26px;
    border-radius:50%;background:linear-gradient(135deg,#FF7FA8,#C24E7C);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;
    box-shadow:0 3px 10px rgba(194,78,124,.6)}
  .wishDate{display:block;font-size:12px;color:#FFD36B;opacity:.9;margin:0 0 12px;letter-spacing:.5px}
  /* 递信/睡觉的小提示气泡 */
  #wishToast{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:24;
    pointer-events:none;padding:9px 18px;border-radius:999px;font-size:13px;letter-spacing:.5px;
    background:rgba(20,14,36,.86);border:1px solid rgba(255,211,107,.3);color:#FFF3D0;
    opacity:0;transition:opacity .3s ease;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  #wishToast.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
  <canvas id="fx"></canvas>
  <div id="curtain"></div>

  <div id="hud">
    <div class="topbar">
      <div class="tip" id="tip"></div>
      <div class="timerRow" id="timerRow">
        <div class="tnum" id="tnum">0.00</div>
        <div class="bar"><div class="barIn" id="barIn"></div></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="tapHint" id="tapHint"></div>
    <div class="sndBtn" id="sndBtn">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    </div>
  </div>

  <div class="modal" id="failModal">
    <div class="card">
      <h3>差一点点…</h3>
      <p>时间到，她滑下来了<br>点住发光的岩点，一步一步往上爬</p>
      <button class="btn" id="retryBtn">再来一次</button>
    </div>
  </div>

  <div id="wishToast"></div>

  <div id="end">
    <div class="kicker">HAPPY BIRTHDAY</div>
    <h1>生日快乐</h1>
    <div class="sub">在呼噜的陪伴下<br>今天的愿望，一定都会实现</div>
    <div id="endCats"></div>
    <div id="cakeBox"></div>
    <div class="hintc" id="hintC">把愿望留在烛光里 ✨</div>
    <button class="btn replay" id="replayBtn">开心循环</button>
  </div>

  <!-- 许愿面板：小猫递来信封后，打字或录音许愿 -->
  <div class="wishPanel" id="wishPanel">
    <div class="wishCard">
      <div class="wishSeal">✉</div>
      <h3>写给生日的愿望</h3>
      <p>把悄悄话装进信里，交给呼噜吧</p>
      <div class="wishTabs">
        <button class="wtab on" id="wishTabType">✎ 打字</button>
        <button class="wtab" id="wishTabAudio">● 录音</button>
      </div>
      <div id="wishTypeWrap">
        <textarea id="wishText" maxlength="200" placeholder="写下你的愿望…"></textarea>
        <div class="wishCount"><span id="wishCount">0</span> / 200</div>
      </div>
      <div id="wishAudioWrap" style="display:none">
        <button class="recBtn" id="recBtn">● 开始录音</button>
        <div class="recHint" id="recHint">点一下开始，再点一下结束（最长 15 秒）</div>
        <audio id="wishAudioPlay" controls style="display:none"></audio>
      </div>
      <div class="wishActs">
        <button class="btn" id="wishSend">把愿望交给小猫</button>
        <button class="btn ghost" id="wishSkip">先不写啦</button>
      </div>
    </div>
  </div>

  <!-- 回访第一步：小猫在灯的背景里送来一封「关上的信」 -->
  <div class="wishPanel" id="envClosedPanel">
    <div class="wishCard">
      <div class="envArt"><div class="body"></div><div class="flap"></div><div class="seal">♥</div></div>
      <h3>呼噜送来了一封信</h3>
      <p>打开看看上次写下的愿望吧</p>
      <div class="wishActs">
        <button class="btn" id="envOpenBtn">打开信封</button>
        <button class="btn ghost" id="envNewBtn">重新许愿</button>
      </div>
    </div>
  </div>

  <!-- 回访第二步：打开信 → 看到上次愿望与许愿日期 → 保留 / 重新许愿 -->
  <div class="wishPanel" id="revisitPanel">
    <div class="wishCard">
      <div class="wishSeal">✉</div>
      <h3>上次许下的愿望</h3>
      <div class="wishDate" id="revisitDate"></div>
      <div class="revisitWish" id="revisitWish"><div id="revisitBody"></div></div>
      <div class="wishActs">
        <button class="btn" id="revisitKeep">保留愿望</button>
        <button class="btn ghost" id="revisitNew">重新许愿</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ==========================================================================
   工具
   ========================================================================== */
var NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){
  var e=document.createElementNS(NS,tag);
  if(attrs) for(var k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function easeBack(t){var c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}
function seeded(seed){var s=seed;return function(){s=(s*9301+49297)%233280;return s/233280;};}
function blobPts(n,r,rnd,squash){
  var p=[];
  for(var i=0;i<n;i++){
    var a=i/n*Math.PI*2, rr=r*(0.78+rnd()*0.46);
    p.push([Math.cos(a)*rr,Math.sin(a)*rr*(squash||1)]);
  }
  return p;
}
function smooth(pts){
  var n=pts.length;
  function mid(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2];}
  var m=mid(pts[n-1],pts[0]);
  var d="M"+m[0].toFixed(1)+" "+m[1].toFixed(1);
  for(var i=0;i<n;i++){
    var c=pts[i],x=mid(c,pts[(i+1)%n]);
    d+=" Q"+c[0].toFixed(1)+" "+c[1].toFixed(1)+" "+x[0].toFixed(1)+" "+x[1].toFixed(1);
  }
  return d+"Z";
}
function polar(a,r){return [Math.cos(a)*r,Math.sin(a)*r];}

/* ==========================================================================
   音效（纯 WebAudio 合成）
   ========================================================================== */
var AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;}}
  if(AC&&AC.state==="suspended")AC.resume();
  return AC;
}
function tone(f,dur,type,vol,to,delay){
  var c=ac();if(!c||muted)return;
  var t=c.currentTime+(delay||0);
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(30,to),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol||.18,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.04);
}
function noise(dur,vol,freq){
  var c=ac();if(!c||muted)return;
  var t=c.currentTime;
  var n=c.createBufferSource(),b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*dur)),c.sampleRate);
  var d=b.getChannelData(0);
  for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  n.buffer=b;
  var f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=freq||800;
  var g=c.createGain();g.gain.value=vol||.15;
  n.connect(f);f.connect(g);g.connect(c.destination);n.start(t);
}

/* ==========================================================================
   蘑菇灯（开场互动道具）
   参考商品图：橙色蘑菇造型小夜灯，三档可调光，灯罩下蜷着一只黑猫。
   世界坐标：灯座落在 GROUND，发光中心在 LAMP_LIGHT_Y。
   三档亮度通过 #lampGlow 光晕半径/透明度、灯罩填色与地面光斑联动。
   ========================================================================== */
function buildLamp(){
  lampG.innerHTML="";
  var g=lampG,x=LAMP_X,baseY=GROUND,ly=LAMP_LIGHT_Y;
  /* 1. 暖光晕：初始很小很淡，拍灯后由 setLampLevel 放大增亮 */
  L.halo=el("circle",{id:"lampHalo",cx:x,cy:ly,r:70,fill:"url(#lampGlow)",
    opacity:"0","pointer-events":"none"},g);
  /* 2. 地面光斑 */
  L.pool=el("ellipse",{id:"lampPool",cx:x,cy:baseY+2,rx:96,ry:20,
    fill:"#FFC869",opacity:"0","pointer-events":"none"},g);
  /* 3. 灯罩：蘑菇伞盖。米黄底 + 橙色斑点；内部填色随亮度变亮 */
  var shade=el("g",{id:"lampShade"},g);
  el("path",{d:"M"+(x-92)+" "+ly+" C"+(x-92)+" "+(ly-58)+" "+(x-52)+" "+(ly-92)+" "+x+" "+(ly-92)+
    " C"+(x+52)+" "+(ly-92)+" "+(x+92)+" "+(ly-58)+" "+(x+92)+" "+ly+
    " Q"+x+" "+(ly+22)+" "+(x-92)+" "+ly+" Z",
    fill:"#E9C48A",stroke:"#B98A4E","stroke-width":3},shade);
  /* 灯罩下缘的暖黄发光带（随亮度增强） */
  L.gill=el("path",{d:"M"+(x-88)+" "+(ly+2)+" Q"+x+" "+(ly+24)+" "+(x+88)+" "+(ly+2)+
    " Q"+x+" "+(ly+14)+" "+(x-88)+" "+ly+" Z",fill:"#FFE9A8",opacity:".25"},shade);
  /* 斑点：参考图的橙色多边形点缀 */
  var spots=[[-58,-44,11],[-24,-70,9],[16,-66,10],[52,-40,12],[-6,-40,8],[36,-16,7]];
  spots.forEach(function(s){
    var pts="";for(var i=0;i<6;i++){var a=i/6*Math.PI*2;pts+=(s[0]+Math.cos(a)*s[2]).toFixed(1)+","+
      (s[1]+Math.sin(a)*s[2]).toFixed(1)+" ";}
    el("polygon",{points:pts.trim(),fill:"#E58B2E",opacity:".9",
      transform:"translate("+x+","+ly+")"},shade);
  });
  /* 4. 灯柱（橙色）+ 大圆盘底座（参考商品图：底盘宽大、猫蜷其上） */
  el("path",{d:"M"+(x-17)+" "+(ly+8)+" L"+(x-13)+" "+(baseY-18)+" Q"+x+" "+(baseY-8)+" "+
    (x+13)+" "+(baseY-18)+" L"+(x+17)+" "+(ly+8)+" Z",fill:"#E07B25"},g);
  el("path",{d:"M"+(x-13)+" "+(ly+8)+" L"+(x-10)+" "+(baseY-20),stroke:"#F19A46",
    "stroke-width":5,fill:"none","stroke-linecap":"round"},g);
  /* 底座三层叠出厚度；最上层留出一圈平台供睡猫趴着 */
  el("ellipse",{cx:x,cy:baseY-6,rx:LAMP_BASE_RX,ry:LAMP_BASE_RY,fill:"#B85618"},g);
  el("ellipse",{cx:x,cy:baseY-11,rx:LAMP_BASE_RX,ry:LAMP_BASE_RY,fill:"#E07B25"},g);
  el("ellipse",{cx:x,cy:baseY-15,rx:LAMP_BASE_RX-8,ry:LAMP_BASE_RY-6,fill:"#F19A46"},g);
  el("ellipse",{cx:x,cy:baseY-15,rx:LAMP_BASE_RX-30,ry:LAMP_BASE_RY-12,fill:"#FFC069",opacity:".5"},g);
  /* 5. 整盏灯的点击热区（透明）：居中覆盖灯罩到灯座，拍灯用 */
  L.hit=el("rect",{id:"lampHit",x:x-100,y:ly-100,width:200,height:(baseY-ly)+110,
    fill:"transparent",style:"cursor:pointer"},g);
  setLampLevel(0);
}
/* 设置灯的亮度档位 0/1/2：光晕、地面光斑、灯罩发光同步变化 */
function setLampLevel(lv){
  S.lampLevel=clamp(lv,0,2);
  var conf=[
    {halo:0, r:70, pool:0, gill:.22, shade:"#E9C48A"},
    {halo:.55,r:150,pool:.22,gill:.6, shade:"#F5D8A0"},
    {halo:1,  r:260,pool:.42,gill:1,   shade:"#FFEBC0"}
  ][S.lampLevel];
  if(L.halo){L.halo.setAttribute("r",conf.r);L.halo.setAttribute("opacity",conf.halo);}
  if(L.pool)L.pool.setAttribute("opacity",conf.pool);
  if(L.gill)L.gill.setAttribute("opacity",conf.gill);
  var sh=$("lampShade");
  if(sh){var p=sh.querySelector("path");if(p)p.setAttribute("fill",conf.shade);}
  /* 黑底生日文字：第一下微亮只隐约透出，第二下最亮时清晰浮现 */
  var iw=$("introWordText");
  if(iw){
    var wordOp=[0,0.16,0.62][S.lampLevel];
    iw.setAttribute("opacity",wordOp);
    iw.style.transition="opacity .55s ease";
  }
}

/* 灯罩被拍时的抖动反馈 */
function bumpLamp(){
  if(!lampG)return;
  var st=performance.now(),x=LAMP_X;
  (function a(){
    var t=(performance.now()-st)/340;
    if(t>=1){lampG.setAttribute("transform","");return;}
    var d=Math.sin(t*Math.PI*5)*(1-t)*5;
    lampG.setAttribute("transform","rotate("+d.toFixed(2)+" "+x+" "+GROUND+")");
    requestAnimationFrame(a);
  })();
}

/* ==========================================================================
   岩点绘制（真实 hold 的体积感：投影 + 主体 + 抓握结构描边 + 上缘高光 + 纹理）
   分层顺序很关键：先投影、再主体、再结构线、最后高光与纹理。
   ========================================================================== */
function buildHold(parent,key,big){
  /* 手机端放大：托盘与墙上的岩点都比原来大 ~1.3 倍，
     配合更大的透明命中圆和凹槽，点得准也看得清。 */
  /* 岩点保持好点，但比人物（高约155）明显小一圈：墙上 1.15 / 托盘 1.45。
     点击命中圆独立于这个缩放，不受影响。 */
  var t=TYPES[key], s=big?1.45:1.15;
  var g=el("g",{transform:"scale("+s+")"},parent);
  var isPocket=(key==="pocket");

  /* 1. 墙上投影：岩点凸出于墙面，光从左上，故影偏右下。
      pocket 的洞不参与挖空（投影应是完整实心），否则洞里会漏出墙色 */
  var shPath=HOLD_PATH[key];
  if(isPocket)shPath=shPath.split(" Z ")[0]+" Z";
  el("path",{d:shPath,fill:"#120d1e",opacity:".42",transform:"translate(3,6)"},g);

  /* 2. 主体：左上受光的斜向渐变；pocket 用 evenodd 把洞挖穿 */
  var body=el("path",{d:HOLD_PATH[key],fill:"url(#g_"+key+")"},g);
  if(isPocket)body.setAttribute("fill-rule","evenodd");

  /* 3. 抓握结构：内凹描边（不是色块），标示这是手能扣住的地方 */
  if(HOLD_PATH[key+"In"]){
    el("path",{d:HOLD_PATH[key+"In"],fill:"none",stroke:t.dark,"stroke-width":4.5,
      opacity:".9","stroke-linecap":"round"},g);
  }

  /* 4. 外轮廓：内侧一圈暗边，把岩点和墙面分开 */
  var stroke=el("path",{d:HOLD_PATH[key],fill:"none",stroke:t.dark,"stroke-width":2.4,opacity:".9"},g);
  if(isPocket)stroke.setAttribute("fill-rule","evenodd");

  /* 5. 轮廓左上缘的光：一道亮边，强化凸起感 */
  if(HOLD_PATH[key+"Lip"]){
    el("path",{d:HOLD_PATH[key+"Lip"],fill:"none",stroke:t.light,"stroke-width":3.2,
      opacity:".9","stroke-linecap":"round"},g);
  }

  /* 6. 顶部高光 */
  el("path",{d:"M-15,-16 C-9,-23 4,-24 10,-19",stroke:"#fff","stroke-width":4,
    opacity:".5",fill:"none","stroke-linecap":"round"},g);

  /* pocket 的洞：用 evenodd 挖穿后要补洞内暗面，让深度成立。
   必须在纹理点之前画，否则纹理点会浮在洞里。 */
  if(isPocket){
    el("path",{d:"M-7,-6 C-14,-6 -18,1 -15,7 C-12,13 -4,14 1,9 C6,4 1,-6 -7,-6 Z",
      fill:"#181022"},g);
    el("path",{d:"M-7,-6 C-14,-6 -18,1 -15,7",fill:"none",stroke:"#080510",
      "stroke-width":3.6,"stroke-linecap":"round"},g);
  }

  /* 抓握纹理点 */
  var tr=seeded(key.length*77+13);
  for(var i=0;i<5;i++){
    var a=tr()*Math.PI*2, r=4+tr()*9;
    el("circle",{cx:(Math.cos(a)*r).toFixed(1),cy:(Math.sin(a)*r*.7).toFixed(1),
      r:(1+tr()*1.2).toFixed(1),fill:t.dark,opacity:".28"},g);
  }
  return g;
}

/* ---------- 凹陷（凹槽） ---------- */
function buildDents(){
  dentG.innerHTML="";dents=[];
  SLOTS.forEach(function(sl,i){

    var g=el("g",{transform:"translate("+sl.x+","+sl.y+")",opacity:"0"},dentG);
    el("path",{d:smooth(blobPts(11,40,rnd,.88)),fill:"#251e3c",opacity:".95"},g);
    var hole=smooth(blobPts(10,29,rnd,.84));
    el("path",{d:hole,fill:"#0b0716"},g);
    el("path",{d:hole,fill:"none",stroke:"#191330","stroke-width":3.4,opacity:".85"},g);
    for(var c=0;c<5;c++){
      var ca=c/5*Math.PI*2+rnd()*.8;
      el("path",{d:"M"+(Math.cos(ca)*25).toFixed(1)+" "+(Math.sin(ca)*21).toFixed(1)+
        " l"+(Math.cos(ca)*24).toFixed(1)+" "+(Math.sin(ca)*22).toFixed(1),
        stroke:"#3d3158","stroke-width":2.4,fill:"none","stroke-linecap":"round",opacity:".65"},g);
    }
    /* 需要的岩点形状提示（虚线轮廓），与放大后的岩点等比例。
       hint 自带 scale，不干扰外层 revealDent 对 d.g 的缩放动画。 */
    var hint=el("g",{opacity:"0",transform:"scale(1.28)"},g);
    var hs=el("path",{d:HOLD_PATH[sl.t],fill:"none",stroke:"#FFC24B","stroke-width":2.6,
      "stroke-dasharray":"7 8"},hint);
    if(sl.t==="pocket")hs.setAttribute("fill-rule","evenodd");
    hs.setAttribute("class","dentOutline");
    el("circle",{r:34,fill:"none",stroke:"#FFC24B","stroke-width":1.4,opacity:".3","stroke-dasharray":"3 9"},hint);
    dents.push({g:g,hint:hint,hs:hs,x:sl.x,y:sl.y,t:sl.t,shown:false,filled:false,fillNode:null});
  });
}
function revealDent(i){
  var d=dents[i];if(d.shown)return;d.shown=true;
  var g=d.g,x=SLOTS[i].x,y=SLOTS[i].y;
  g.setAttribute("opacity","1");
  g.setAttribute("transform","translate("+x+","+y+") scale(.15)");

    var t=Math.min(1,(performance.now()-st)/420);
    g.setAttribute("transform","translate("+x+","+y+") scale("+(0.15+0.85*easeOut(t)).toFixed(3)+")");

      g.setAttribute("transform","translate("+x+","+y+")");
      d.hint.style.transition="opacity .5s";
      d.hint.setAttribute("opacity",".55");
    }
  })();
}

var seq=null,seqT=0,beatT=0,beatN=0;

/* ---------- 第 0 幕：黑底开场 · 拍灯唤醒小猫 ---------- */
/* 开场只留黑底 + 灯 + 猫 + 手：藏起墙、夜空、地面和整个人物。
   flee/chase 阶段才把女孩整个人放出来追猫；离开开场时全部复原。 */
function setIntroScene(on){
  var hide=[skyG,wallG,groundG,dentG,holdG,goalG,propG,trayG,afterG];
  hide.forEach(function(nd){if(nd)nd.setAttribute("display",on?"none":"");});
  /* 灯只属于开始页面：开场显示黑底与灯，切到墙页面后隐藏 */
  if(introBg)introBg.setAttribute("display",on?"":"none");
  if(introWordG)introWordG.setAttribute("display",on?"":"none");
  if(lampG)lampG.setAttribute("display",on?"":"none");
  if(sleepG)sleepG.setAttribute("display",on?"":"none");
  /* 开场只看到手，不看到站着的女孩；追猫阶段再单独显示 */
  if(girlG)girlG.setAttribute("display",on?"none":"");
  if(on===false&&handG){handG.setAttribute("display","none");handG.setAttribute("opacity","0");}
}
/* 手从画面外伸进来拍一下灯：伸入 → 下拍 → 收回 */
function patHand(){
  if(!handG)return;
  handG.setAttribute("display","");
  var st=performance.now(),dur=440;
  var x0=LAMP_X+250,x1=LAMP_X+8,y=LAMP_LIGHT_Y-34;
  (function a(){
    var t=(performance.now()-st)/dur;
    if(t>=1){handG.setAttribute("opacity","0");handG.setAttribute("display","none");return;}
    var x,dy=0;
    if(t<0.34){var k=t/0.34;x=lerp(x0,x1,k*k);}             /* 缓入伸出 */
    else if(t<0.5){x=x1;dy=26*Math.sin((t-0.34)/0.16*Math.PI);} /* 拍下 */
    else{var k2=(t-0.5)/0.5;x=lerp(x1,x0,k2*k2);}          /* 收回 */
    handG.setAttribute("opacity","1");
    handG.setAttribute("transform","translate("+x.toFixed(1)+","+(y+dy).toFixed(1)+")");
    requestAnimationFrame(a);
  })();
}
function startLamp(){
  S.act=LAMP;S.lampLevel=0;S.lampPhase="wait";S.lampT=0;S.lampWoke=false;
  clearFxSmoke();   /* 清掉上一轮吹烛残留的白色烟雾，别带到新一轮墙面上 */
  setIntroScene(true);
  /* 用专门的蜷缩睡猫贴在灯座旁；站立猫先隐藏，醒来后再切回 */
  S.catX=LAMP_CAT_SLEEP_X;S.catY=LAMP_CAT_SLEEP_Y;S.catFace=1;S.catVisible=false;S.catFade=1;
  if(sleepG)sleepG.setAttribute("transform","translate("+LAMP_CAT_SLEEP_X+","+LAMP_CAT_SLEEP_Y+")");
  var se=$("sleepShut"),oe=$("sleepOpen");
  if(se)se.setAttribute("display","");
  if(oe)oe.setAttribute("display","none");

/* 拍灯：第一下微亮、第二下更亮并唤醒猫 */
function tapLamp(){
  if(S.act!==LAMP||S.lampPhase!=="wait")return;
  S.lampT=0;
  var lv=S.lampLevel+1;
  setLampLevel(lv);
  bumpLamp();
  patHand();                       /* 女孩的手伸进来拍灯 */
  SFX.press();
  if(lv>=2){
    /* 灯最亮：小猫醒来 */
    S.lampPhase="wake";
    setTapHint("",false);
    setTip("灯亮了！小猫醒来了",2000);
    SFX.meow();
    if(C.eyes)C.eyes.setAttribute("opacity","1");
    /* 睡猫睁眼，表示被吵醒（随后切回站立猫跑开） */
    var se=$("sleepShut"),oe=$("sleepOpen");
    if(se)se.setAttribute("display","none");
    if(oe)oe.setAttribute("display","");
    setTimeout(function(){if(S.act===LAMP&&S.lampPhase==="wake"){
      S.lampPhase="flee";S.lampT=0;S.lampWoke=true;S.pose="run";S.catFace=1;
      /* 睡猫退场、站立猫登场（已睁眼），从灯座旁窜出去 */
      if(sleepG)sleepG.setAttribute("display","none");
      S.catVisible=true;
      S.catX=LAMP_CAT_SLEEP_X;S.catY=LAMP_CAT_SLEEP_Y;
      if(C.body)C.body.removeAttribute("transform");
      if(C.head)C.head.setAttribute("transform","translate(0,-78)");
      setTip("小猫跑开了！",1800);
    }},700);
  }else{
    setTip("再拍一下，灯会更亮",2200);
  }
}
/* 灯幕每帧：flee=猫跑出画面 → chase=女孩冲进来追 → 切回墙页面 */
function updateLamp(dt){
  if(S.act!==LAMP)return;
  S.lampT+=dt;
  if(S.lampPhase==="flee"){
    var e=easeInOut(clamp(S.lampT/1.15,0,1));
    S.catX=lerp(LAMP_CAT_SLEEP_X,LAMP_CAT_FLEE_X,e);
    /* 前 0.3 秒从灯座上跳到地面，之后沿地面边跑边颠 */
    if(S.lampT<0.3)S.catY=lerp(LAMP_CAT_SLEEP_Y,GROUND,clamp(S.lampT/0.3,0,1))-Math.sin(clamp(S.lampT/0.3,0,1)*Math.PI)*22;
    else S.catY=GROUND-Math.abs(Math.sin(S.lampT*17))*6;
    if(S.lampT>=1.15){
      /* 猫从灯后跑进墙：柔和落幕 → 切回墙页面 → 猫直接砸墙。
         不再追猫、也不再跳舞；女孩要等猫砸到最后两下才跑来。 */
      var cur=$("curtain");
      if(cur){cur.style.transition="none";cur.style.opacity="1";setIntroScene(false);
        void cur.offsetWidth;cur.style.transition="opacity .6s ease";cur.style.opacity="0";}
      else setIntroScene(false);
      S.pose="idle";S.catY=GROUND;
      if(C.body)C.body.removeAttribute("transform");
      if(C.head)C.head.setAttribute("transform","translate(0,-78)");
      if(C.eyes)C.eyes.setAttribute("opacity","1");
      S.catX=CAT_HOME.x;S.catFace=1;S.catVisible=true;S.catFade=1;
      startPunch();
    }
  }
}

}
function startCatIn(){
  S.act=CATIN;S.catVisible=true;S.catX=560;
  setTip("一只黑猫凑了过来",2400);
  seqT=0;
}
function startDuet(){
  S.act=DUET;S.pose="dance";
  setTip("一人一猫，一起跳 · 轻点可跳过",2800);
  seqT=0;beatT=0;beatN=0;
}
function startPunch(){
  S.act=PUNCH;S.pose="idle";S.armTarget=null;
  setTip("小猫冲向墙壁，一拳一个洞！",3000);
  /* 女孩此时还在场外（黑底开场没有追猫、也不跳舞），先不出现；
     等猫砸到最后两下才从左侧跑进来。 */
  S.girlX=-140;S.girlY=GROUND;S.pose="idle";
  if(girlG)girlG.setAttribute("display","none");
  S.catX=CAT_HOME.x;S.catY=GROUND;S.catFace=1;S.catVisible=true;S.catFade=1;
  if(C.body)C.body.removeAttribute("transform");
  var steps=[];
  for(var i=0;i<SLOTS.length;i++){
    /* 女孩入场改为并行动画：在猫砸第 4 个洞时同时从左侧跑进，
       不再占用 seq 的时间片，猫全程保持砸墙节奏、不停顿。 */
    steps.push({t:"goto",i:i,by:"cat"});
    steps.push({t:"hit",i:i,by:"cat"});
    steps.push({t:"back",i:i,by:"cat"});
  }
  seq={steps:steps,idx:0,t:0,dur:0};
  seqT=0;
  S.girlRunStarted=false;S.girlRun=false;
}
/* 女孩并行跑进画面：与猫砸墙同时进行，用独立 rAF 计时，不占用砸墙 seq */
function startGirlRunIn(){
  if(S.girlRunStarted)return;
  S.girlRunStarted=true;
  if(girlG)girlG.setAttribute("display","");
  S.girlRun=true;
  setTip("她也跑了过来…",1600);
  var st=performance.now(),sx=-140,ex=GIRL_HOME.x-24,dur=1000;
  (function a(){
    if(S.act!==PUNCH){S.girlRun=false;return;}
    var t=clamp((performance.now()-st)/dur,0,1),e=easeInOut(t);
    S.girlX=lerp(sx,ex,e);
    S.girlY=GROUND-Math.abs(Math.sin(t*Math.PI*5))*9;
    if(t<1)requestAnimationFrame(a);
    else{S.girlRun=false;S.girlX=ex;S.girlY=GROUND;}
  })();
}
function finishPunch(){
  seq=null;
  /* 猫打完 5 个墙洞后真的跑出画面；它离场后才轮到玩家装岩点。 */
  setTip("小猫打完墙，跑走了…",2000);
  runOffCat(function(){
    if(S.act!==PUNCH)return;
    S.pose="idle";S.armTarget=null;
    S.girlX=GIRL_HOME.x;S.girlY=GIRL_HOME.y;
    startStory();
  });
}

/* 猫向右跑出画面，最后才隐藏；不是原地直接消失。 */
function runOffCat(cb){
  S.pose="idle";S.catFace=1;S.catVisible=true;
  C.armF.setAttribute("transform","rotate(14 13 -56)");
  var st=performance.now(),sx=S.catX;
  (function a(){
    var t=clamp((performance.now()-st)/1200,0,1);
    S.catX=lerp(sx,560,easeInOut(t));
    S.catY=GROUND-Math.abs(Math.sin(t*Math.PI*6))*5;
    S.catFade=t>.82?clamp(1-(t-.82)/.18,0,1):1;
    if(t<1)requestAnimationFrame(a);
    else{
      S.catVisible=false;S.catFade=1;S.catX=560;S.catY=GROUND;
      if(cb)cb();
    }
  })();
}
/* 阁楼版：戴领结的猫从阁楼地板这一侧（右侧）跑出画面，不再回到墙底坐标。
   阁楼地板线为 GOAL.y，镜头焦点 GOAL.x+70，右侧出画点约 GOAL.x+330。 */
function runOffCatAttic(cb){
  S.pose="idle";S.catFace=1;S.catVisible=true;
  var st=performance.now(),sx=S.catX,ex=GOAL.x+330;
  (function a(){
    var t=clamp((performance.now()-st)/1150,0,1);
    S.catX=lerp(sx,ex,easeInOut(t));
    S.catY=GOAL.y-Math.abs(Math.sin(t*Math.PI*7))*6;
    S.catFade=t>.78?clamp(1-(t-.78)/.22,0,1):1;
    if(t<1)requestAnimationFrame(a);
    else{
      S.catVisible=false;S.catFade=1;S.catX=560;S.catY=GOAL.y;
      if(cb)cb();
    }
  })();
}

/* 走到某个凹陷下方 */
function moveToSlot(i,by,dur){
  var sl=SLOTS[i];
  var tx=sl.x+(by==="girl"?-46:30), ty=sl.y+96;
  var sx=by==="girl"?S.girlX:S.catX, sy=by==="girl"?S.girlY:S.catY;
  return {t:"goto",dur:dur,from:{x:sx,y:sy},x:tx,y:ty,by:by};
}
function updateStory(dt){
  if(S.act===DANCE){
    seqT+=dt;
    if(seqT>4.2)startCatIn();
  }else if(S.act===CATIN){
    seqT+=dt;
    var k=Math.min(1,seqT/1.6);
    S.catX=lerp(560,CAT_HOME.x,easeOut(k));
    if(k>=1)startDuet();
  }else if(S.act===DUET){
    seqT+=dt;
    beatT-=dt;
    if(beatT<=0){
      beatT=0.44;beatN++;
      SFX.beat(beatN%2===0);
      if(beatN%4===1)note(S.girlX+18,S.girlY-172,"♪");
      if(beatN%4===3)note(S.catX+14,S.catY-124,"♫");
    }
    if(seqT>4.0)startPunch();
  }else if(S.act===PUNCH&&seq){
    updatePunchSeq(dt);
  }
}

/* STORY 幕：按当前小关分发更新 */
function updateStoryStage(dt){
  if(S.phase!=="story")return;
  if(S.step===STEP_WAND)updateWand(dt);
  else if(S.step===STEP_SEW)updateSew(dt);
  else if(S.step===STEP_SHOOT)updateShoot(dt);
  else if(S.step===STEP_BOWTIE)updateBow(dt);
  else if(S.step===STEP_RED)updateRed(dt);
}
function updatePunchSeq(dt){
  if(seq.t===0){
    var s=seq.steps[seq.idx];
    if(!s){finishPunch();return;}
    if(s.t==="goto"){
      /* 猫砸第 4 个洞时，女孩同时从左侧跑进来（并行，不打断猫） */
      if(s.i===3)startGirlRunIn();
      var m=moveToSlot(s.i,"cat",.34);
      seq.dur=m.dur;seq.from=m.from;seq.gx=m.x;seq.gy=m.y;seq.by="cat";
    }else if(s.t==="hit"){
      seq.dur=.34;
      /* 只有猫挥拳，女生跑进来后抱臂旁观 */
      S.pose="punchCat";
      SFX.thud();
      var sl=SLOTS[s.i];
      spawnImpact(sl.x,sl.y,"#C9B6FF");
      revealDent(s.i);
      shake(6,.2);
      SFX.meow();
    }else if(s.t==="back"){
      seq.dur=.28;seq.by="cat";
      seq.from={x:S.catX,y:S.catY};
      seq.gx=CAT_HOME.x;seq.gy=GROUND;
    }
  }
  var s=seq.steps[seq.idx];
  seq.t+=dt;
  var t=clamp(seq.t/seq.dur,0,1);
  if(s.t==="hit"){
    S.poseT+=dt;
    /* 猫挥拳；女孩此刻若已跑进来就抱臂旁观（girlRun 已清） */
    var a2=t<.28?lerp(16,-142,easeOut(t/.28)):(t<.42?lerp(-142,16,(t-.28)/.14):16);
    C.armF.setAttribute("transform","rotate("+a2.toFixed(1)+" 13 -56)");
    S.catY=SLOTS[s.i].y+96-Math.sin(Math.min(1,t/.34)*Math.PI)*12;
  }else{
    var e=easeInOut(t);
    var nx=lerp(seq.from.x,seq.gx,e), ny=lerp(seq.from.y,seq.gy,e);
    if(s.t==="goto")ny-=Math.sin(t*Math.PI)*34;
    S.catX=nx;S.catY=ny;   /* 砸墙 seq 现在只驱动猫；女孩跑动由 startGirlRunIn 并行处理 */
  }
  if(t>=1){
    if(s.t==="hit"){S.pose="idle";C.armF.setAttribute("transform","rotate(14 13 -56)");}
    else if(s.t==="back"){S.catY=GROUND;}
    seq.idx++;seq.t=0;
  }
}

/* ==========================================================================
   插曲：五个岩点，五段小剧情
   1 逗猫棒 —— 猫出来一下又跑开
   2 缝纫机 —— 缝一个猫用的小领结
   3 射击游戏 —— 打靶
   4 戴上领结 —— 猫终于愿意留下
   5 红色按钮 —— 猫推着生日蛋糕出现
   ========================================================================== */
var STORY_PROPS={};

/* ---------- 剧情幕入口 ---------- */
function startStory(){
  S.act=STORY;S.stepDone=0;S.placed=0;
  S.girlRun=false;
  if(girlG)girlG.setAttribute("display","");
  S.girlX=GIRL_HOME.x;S.girlY=GIRL_HOME.y;
  /* 安装阶段保持砸墙后的整面墙全景，女生和岩点筐都在地面。 */
  cam.tk=OV_K;cam.tx=200-S.girlX*OV_K;cam.ty=VIEW_H*0.94-GROUND*OV_K;
  clearProps();
  trayG.innerHTML="";buildTray();
  /* 关键顺序：先连续装好全部岩点，安装阶段不播放任何任务。 */
  enterPlacement(STEP_WAND);
}

/* 玩家安装阶段：猫已离场，墙上只有凹陷，脚边岩点可立即点击。
   五个岩点全部装完才开始攀爬；安装期间绝不播放任务插曲。 */
function enterPlacement(n){
  n=clamp(n,0,SLOTS.length-1);
  S.act=STORY;S.phase="place";S.step=n;S.pickReady=1;
  clearProps();
  clearSelection();
  S.pose="idle";S.armTarget=null;
  S.wandHits=0;S.wandT=0;S.catPeek=0;
  S.sewT=0;S.sewProg=0;S.sewStitch=0;S.sewDone=false;
  S.shootScore=0;S.shootShots=0;S.shootHit=0;
  S.bowOn=0;S.bowPos=null;S.bowPlaced=false;S.dragBow=false;S.bowHeld=false;
  S.redPress=0;S.cakeOut=0;
  S.catVisible=false;S.catFade=1;S.catX=560;S.catY=GROUND;
  /* 只更换目标凹槽，不移动女生；五次安装始终站在地面。 */
  S.girlX=GIRL_HOME.x;S.girlY=GIRL_HOME.y;
  trayG.setAttribute("class","shown");
  setTip("先点脚边岩点选中，再点墙上同形状的凹槽装上去",3600);
}

/* 攀爬任务的站位：**事件跟着岩点走**。
   五个岩点在墙上自下而上（y 1560→520）。女生先装好全部岩点，
   攀爬到达某个岩点时才触发对应任务，并停在岩点下方互动。
   站位比岩点低 175：岩点落在她头顶略上方，抬手的动作对得上；
   道具在胸腹高度（手持），两者不打架。 */
function stepStageY(i){ return SLOTS[i].y+175; }
function stepStageX(i){ return clamp(SLOTS[i].x-64,56,96); }
/* 攀爬抓点的站位：站在岩点正下方偏左，手扶住岩点、下一发光点在头顶。
   与任务站位的区别在于更靠近岩点竖直线，读起来像在墙上换手，而不是站在地上。 */
function climbHoldY(i){ return SLOTS[i].y+78; }
/* 女孩攀爬时站在岩点略内侧（朝墙中心偏 18），随各岩点 x 左右腾挪 */
function climbHoldX(i){
  var cx=SLOTS[i].x, inward=cx<200?18:-18;
  return clamp(cx+inward,WALL_L+70,WALL_R-70);
}

function enterStep(n){
  n=clamp(n,0,SLOTS.length-1);
  /* 从攀岩幕切入任务：act 切到 STORY 后，攀爬位移与倒计时自然暂停。 */
  S.act=STORY;S.step=n;S.phase="story";S.pickReady=0;
  S.gripping=false;S.gripT=0;
  clearProps();
  clearSelection();
  S.pose="idle";S.armTarget=null;
  S.wandHits=0;S.wandT=0;S.catPeek=0;
  S.sewT=0;S.sewProg=0;S.sewStitch=0;S.sewDone=false;
  S.shootScore=0;S.shootShots=0;S.shootHit=0;
  S.bowOn=0;S.bowPos=null;S.bowPlaced=false;S.dragBow=false;S.bowHeld=false;
  S.redPress=0;S.cakeOut=0;
  /* 默认把猫收走：只有系领结/红按钮两关会再放它出来。
     不显式关掉的话，逗猫棒那关淡出到一半的猫会停在屏幕上。 */
  S.catVisible=false;S.catFade=1;S.catX=560;S.catY=S.girlY;
  S.girlX=stepStageX(n);S.girlY=stepStageY(n);

  if(n===STEP_WAND){
    setTip("逗猫棒！晃三下逗猫棒",3600);
    buildWandProp();
  }else if(n===STEP_SEW){
    setTip("一台缝纫机 · 按住缝纫机，缝好领结",3600);
    buildSewProp();
  }else if(n===STEP_SHOOT){
    setTip("一台电脑 · 打掉三个靶子",3400);
    buildShootProp();
  }else if(n===STEP_BOWTIE){
    setTip("给它戴上领结 · 把领结拖到猫脖子上",3600);
    S.catVisible=true;S.catFade=1;S.catFace=-1;
    S.catX=S.girlX+104;S.catY=stepStageY(n);
    buildBowProp();
  }else if(n===STEP_RED){
    setTip("一个红色按钮 · 按下红色按钮",3400);
    S.catVisible=true;S.catFade=1;S.catFace=-1;
    S.catX=S.girlX+104;S.catY=stepStageY(n);
    buildRedProp();
  }
  /* 全部岩点已经装好，任务期间岩点筐保持收起。 */
  trayG.setAttribute("class","stowed");
}

/* 当前岩点任务完成：回到原攀爬进度，而不是重装岩点或从地面重来。
   带令牌：延迟回调只在同一关、同一完成数时生效，避免旧定时器串关。 */
function completeStepAt(n){
  if(S.act!==STORY||S.step!==n||S.phase!=="story")return;
  completeStep();
}
function completeStep(){
  if(S.act!==STORY||S.phase!=="story")return;
  var atStep=S.step;
  S.phase="taskDone";S.stepDone=atStep+1;
  S.pose="cheer";SFX.cheer();setTapHint("",false);
  var atDone=S.stepDone;
  setTip(atDone>=SLOTS.length?"蛋糕送到了，继续爬到终点！":"任务完成，继续向上爬！",1800);
  setTimeout(function(){
    if(S.act!==STORY||S.phase!=="taskDone"||S.step!==atStep||S.stepDone!==atDone)return;
    resumeClimb(atStep);
  },700);
}
/* 任务后停在当前岩点，保留剩余时间与体力，等待玩家主动抓下一点。 */
function resumeClimb(n){
  clearProps();
  S.act=CLIMB;S.phase="climb";S.step=-1;S.pickReady=0;
  S.gripping=false;S.gripT=0;S.slipT=0;S.reached=false;
  S.climbTarget=-1;S.climbGoal=false;S.climbT=0;S.climbFrom=null;S.climbTo=null;
  S.girlY=stepStageY(n);S.girlX=stepStageX(n);S.pose="idle";S.armTarget=null;
  S.catVisible=false;S.catFade=1;
  trayG.setAttribute("class","stowed");
  $("timerRow").classList.add("on");
  setTip(n+1>=SLOTS.length?"点红色终点 · 完成登顶":"点上方发光岩点 · 继续向上",2000);
}

/* 把第 i 个岩点装到墙上（自动，不需要拖） */
function placeHold(i){
  var d=dents[i],sl=SLOTS[i];
  if(d.filled)return;
  d.filled=true;S.placed++;
  var wrap=el("g",{transform:"translate("+sl.x+","+sl.y+")"},holdG);
  buildHold(wrap,d.t,false);
  wrap.setAttribute("transform","translate("+sl.x+","+sl.y+") scale(.4)");
  var st=performance.now();
  (function pop(){
    var t=clamp((performance.now()-st)/340,0,1);
    wrap.setAttribute("transform","translate("+sl.x+","+sl.y+") scale("+(0.4+0.60*easeOut(t)).toFixed(3)+")");
    if(t<1)requestAnimationFrame(pop);
  })();
  d.hint.style.transition="opacity .3s";
  d.hint.setAttribute("opacity","0");
  d.fillNode=wrap;
  burst(sl.x,sl.y,"#fff");
  SFX.place();
  note(sl.x,sl.y-40,"✦");
}

/* ---------- 清空道具层 ---------- */
function clearProps(){
  if(propG)propG.innerHTML="";
  if(uiG)uiG.innerHTML="";
  /* 逗猫棒挂在 girlG 下（要随手移动），得单独清 */
  if(girlG){var w=document.getElementById("wandProp");if(w)w.parentNode.removeChild(w);}
  STORY_PROPS={};
}

/* ==========================================================================
   道具 1：逗猫棒
   ========================================================================== */
function buildWandProp(){
  clearProps();
  /* 逗猫棒是「握在女生手里」的道具，必须挂在 girlG 下才能随手移动；
     放进 propG（世界空间）会固定在原点，且不随角色走。 */
  var g=el("g",{id:"wandProp"},girlG);
  /* 杆 + 绳 + 羽毛球。原点在肩部（右手） */
  var wg=el("g",{id:"wandArm",transform:"translate(13,-100)"},g);
  el("path",{d:"M0,0 L34,-16",stroke:"#8b6b45","stroke-width":5,fill:"none","stroke-linecap":"round"},wg);
  el("path",{d:"M34,-16 q10,-6 18,-2",stroke:"#5c4f7b","stroke-width":2,fill:"none"},wg);
  var feather=el("g",{id:"wandFeather",transform:"translate(52,-18)"},wg);
  el("circle",{cx:0,cy:0,r:7,fill:"#FF6FA5"},feather);
  el("circle",{cx:-1,cy:-1,r:2.4,fill:"#FFD0E0",opacity:".8"},feather);
  for(var i=0;i<5;i++){
    var a=-2.5+i*0.5;
    el("path",{d:"M0,0 q"+(Math.cos(a)*13).toFixed(1)+","+(Math.sin(a)*13).toFixed(1)+
      " "+(Math.cos(a)*20).toFixed(1)+","+(Math.sin(a)*20).toFixed(1),
      stroke:"#FF9DC0","stroke-width":2.2,fill:"none","stroke-linecap":"round",opacity:".8"},feather);
  }
  STORY_PROPS.wand=wg;
  STORY_PROPS.feather=feather;
  /* 猫的藏身角落：一个小纸箱 */
  var box=el("g",{id:"peekBox",transform:"translate("+(S.girlX+116)+","+(S.girlY-4)+")"},propG);
  el("path",{d:"M-40,0 L-30,-38 L30,-38 L40,0 Z",fill:"#6b4f37"},box);
  el("path",{d:"M-30,-38 L30,-38 L24,-30 L-24,-30 Z",fill:"#8a6647"},box);
  el("path",{d:"M-40,0 L40,0 L40,6 L-40,6 Z",fill:"#4a3524"},box);
  STORY_PROPS.box=box;
}
function updateWand(dt){
  var w=STORY_PROPS.wand, f=STORY_PROPS.feather;
  if(!w)return;
  if(S.wandT>0){
    S.wandT-=dt;
    /* 晃动逗猫棒（原点固定在肩部 13,-100，与 buildWandProp 一致） */
    var k=Math.sin(now()*17)*16;
    w.setAttribute("transform","translate(13,-100) rotate("+k.toFixed(1)+")");
    if(f)f.setAttribute("transform","translate(52,-18) rotate("+(k*1.4).toFixed(1)+")");
    if(S.wandT<=0){
      w.setAttribute("transform","translate(13,-100)");
      if(f)f.setAttribute("transform","translate(52,-18)");
    }
  }
  /* 猫探一下又跑掉 */
  if(S.catPeek>0){
    S.catPeek-=dt;
    var t=1-clamp(S.catPeek/1.2,0,1);
    if(S.catPeek>0){
      S.catVisible=true;S.catFade=1;S.catFace=-1;
      S.catX=S.girlX+116+Math.sin(t*Math.PI)*-16;
      S.catY=S.girlY;
      if(S.catFade>0.2)SFX.meow();
    }else{
      /* 跑掉：淡出并移动到画面外 */
      S.catFade=clamp(S.catFade-dt*3.2,0,1);
      S.catX-=260*dt;
      if(S.catFade<=0.02){
        S.catVisible=false;S.catFade=1;S.catX=560;
      }
    }
  }
}
function tapWand(){
  if(S.catPeek>0)return;          /* 猫已经探出来了，不再响应 */
  if(S.wandT>0)return;            /* 正在晃动中，忽略连点 */
  S.wandT=.5;SFX.pick();
  S.wandHits++;
  note(S.girlX+72,S.girlY-160,"✧");
  if(S.wandHits>=3){
    setTip("猫又跑掉了…",2200);
    setTapHint("",false);
    S.catPeek=1.2;SFX.meow();

function buildBowProp(){

  var g=el("g",{id:"bowItem",style:"cursor:pointer"},uiG);
  el("path",{d:BOW_PATH,fill:"#FF6FA5",stroke:"#C24E7C","stroke-width":2.4,class:"bowShape"},g);
  el("circle",{cx:0,cy:0,r:5,fill:"#FFB0CB"},g);
  STORY_PROPS.bow=g;
  /* 猫脖子上的目标圈：加一圈实心底色 + 虚线外环，浅色墙面上也看得清 */
  var ring=el("g",{id:"bowRing",opacity:"0"},uiG);
  el("circle",{cx:0,cy:0,r:30,fill:"rgba(255,194,75,.16)"},ring);
  el("circle",{cx:0,cy:0,r:30,fill:"none",stroke:"#FFC24B","stroke-width":3.4,
    "stroke-dasharray":"7 7"},ring);
  el("circle",{cx:0,cy:0,r:22,fill:"none",stroke:"rgba(255,194,75,.5)","stroke-width":1.4},ring);
  STORY_PROPS.ring=ring;
  /* 领结初始位置：跟着女生的手（见 updateBow 的 bowHeld 分支）。
     这里只给一个兜底值 —— buildBowProp 运行时相机还停在上一个岩点，
     此刻用 screenPt 换算会得到错位的坐标。 */
  S.bowHeld=true;
  S.bowPos=screenPt(S.girlX+54,S.girlY-70);
  S.bowOn=1;S.bowPlaced=false;S.dragBow=false;
}
/* 世界坐标 → uiG 局部坐标。
   uiG 是 root 的直接子节点、自身无 transform，而 root 有 translate(rx,0)。
   领结/虚线框都画在 uiG 里，transform 是「uiG 局部坐标」；
   它再经 root 的 translate(rx,0) 才到 viewBox 空间。
   因此世界点经 cam 变换得到的空间（wx*cam.k+cam.x, wy*cam.k+cam.y）
   已经是 root 的**局部**坐标，可直接作为 uiG 局部坐标 —— 绝不能再减/加 rx，
   否则宽屏（rx>0）时会与指向判定错位、领结看着到位却点不中。 */
function screenPt(wx,wy){
  return {x:wx*cam.k+cam.x, y:wy*cam.k+cam.y};
}
/* 猫脖子在 uiG 局部坐标的位置（世界 catX, catY-56，与 buildCat 的 catBow 一致）。
   用 screenPt 与领结绘制走同一套换算，保证显示与判定完全对齐。 */
function catNeckPt(){
  return screenPt(S.catX,S.catY-56);
}
/* client 坐标 → uiG 局部坐标（与 screenPt 同源）。
   svgPt 得到的是 viewBox 空间坐标，uiG 局部 = viewBox - root.translateX。 */
function clientRootPt(cx,cy){
  var p=svgPt({clientX:cx,clientY:cy});
  var rt=parseFloat((root.getAttribute("transform").match(/translate\(([-\d.]+)/)||[0,0])[1])||0;
  return {x:p.x-rt,y:p.y};
}
function updateBow(dt){
  var g=STORY_PROPS.bow, ring=STORY_PROPS.ring;
  if(!g)return;
  if(S.bowPlaced){
    /* 领结已戴在猫脖子上，跟随猫 */
    var np=catNeckPt();
    g.setAttribute("transform","translate("+np.x.toFixed(1)+","+np.y.toFixed(1)+")");
    if(ring)ring.setAttribute("opacity","0");
    return;
  }
  if(S.dragBow&&S.bowPos){
    /* 拖拽中：领结跟随手指（轻微延迟增加手感） */
    S.bowPos.x=lerp(S.bowPos.x,mouseSvg.x,.5);
    S.bowPos.y=lerp(S.bowPos.y,mouseSvg.y,.5);
  }else if(S.bowHeld){
    /* 还没被拿起：领结一直跟着女生的手。
       必须在每帧按当前相机重算 —— 镜头从上一个岩点缓动过来，
       进场时算一次会停在旧位置。 */
    var hp=screenPt(S.girlX+54,S.girlY-70);
    S.bowPos.x=hp.x;S.bowPos.y=hp.y;
  }
  g.setAttribute("transform","translate("+S.bowPos.x.toFixed(1)+","+S.bowPos.y.toFixed(1)+")"+
    (S.dragBow?" scale(1.12)":""));
  /* 猫脖子上的目标圈 */
  if(ring){
    var cp=catNeckPt();
    ring.setAttribute("transform","translate("+cp.x.toFixed(1)+","+cp.y.toFixed(1)+")");
    ring.setAttribute("opacity",".9");
    ring.setAttribute("class","pulse");
  }
}
function tapBow(x,y){
  if(S.bowPlaced)return;
  /* uiG 在 root 空间内多一层 translate(clientRootPt)。
     领结的绘制用的是 screenPt()（已含 root 偏移），
     所以这里也要用 clientRootPt 对齐同一坐标系，不能直接用 svgPt。 */
  var p=clientRootPt(x,y);
  if(Math.abs(p.x-S.bowPos.x)<40&&Math.abs(p.y-S.bowPos.y)<34){
    S.dragBow=true;S.bowHeld=false;SFX.pick();
  }
}
function moveBow(x,y){ if(S.dragBow){ mouseSvg=clientRootPt(x,y); } }
function releaseBow(x,y){
  if(!S.dragBow)return;
  S.dragBow=false;
  /* 判定松手位置是否在猫脖子附近。
     用指针位置而非 bowPos：拖拽是 lerp 跟随（带延迟），
     松手瞬间 bowPos 可能还没完全追上指针。 */
  var cp=catNeckPt();
  var pt=clientRootPt(x,y);
  /* 取「指针位置」与「领结当前位置」中更近的一个做判定。
     拖拽是 lerp 跟随，松手瞬间 bowPos 往往比指针更贴近目标；
     两者取近者，判定更宽容也更符合直觉。 */
  var dPtr=Math.sqrt(Math.pow(pt.x-cp.x,2)+Math.pow(pt.y-cp.y,2));
  var dBow=Math.sqrt(Math.pow(S.bowPos.x-cp.x,2)+Math.pow(S.bowPos.y-cp.y,2));
  var d=Math.min(dPtr,dBow);
  /* 判定半径 56：目标圈 r=30，留一倍余量，够宽松又不至于误判 */
  if(d<56){
    /* 戴上了：吸附到脖子。登顶后的新章节走 finishWear（随后猫跑开→音符），
       旧任务关卡（已停用）仍走 completeStepAt，保留兼容。 */
    S.bowPos.x=cp.x;S.bowPos.y=cp.y;
    if(S.act===WEAR){finishWear();return;}
    S.bowPlaced=true;
    SFX.cheer();
    SFX.meow();
    note(S.catX,S.catY-96,"♥");
    setTip("小猫戴上了领结",2200);
    var wn=S.step;setTimeout(function(){completeStepAt(wn);},900);
  }else{
    /* 没戴上：弹回女生手边（bowHeld 会让它自动跟手） */
    S.bowHeld=true;
    setTip("要放在猫的脖子上哦",1600);
  }
}

   岩点摆在女生脚边的一筐里。点一下某个岩点 → 装到墙上对应的凹陷上。

   ========================================================================== */
/* 当前要装的凹槽（从下往上第一个还空着的） */
function currentSlot(){
  for(var i=0;i<dents.length;i++)if(!dents[i].filled)return i;
  return -1;
}
/* 命中测试：托盘在 camG（世界空间），要把点击点换算到世界坐标 */
function trayNodeAt(e){
  var p=svgPt(e);
  var rt=parseFloat((root.getAttribute("transform").match(/translate\(([-\d.]+)/)||[0,0])[1])||0;
  var w={x:(p.x-rt-cam.x)/cam.k,y:(p.y-cam.y)/cam.k};
  var ox=S.girlX,oy=S.girlY+TRAY_DY+TRAY_Y;
  var all=trayG.children,best=null,bd=70*70;
  for(var i=0;i<all.length;i++){
    var n=all[i];
    if(!n.__type)continue;
    /* n.__home 是托盘内偏移，必须再加托盘跟随女生的世界坐标。 */
    var dx=ox+n.__home-w.x,dy=oy-w.y,dd=dx*dx+dy*dy;
    if(dd<bd){bd=dd;best=n;}
  }
  return best;
}
/* ========== 两步安装：先选岩点 → 再点墙上同形状凹槽才装好 ========== */
/* 清除选中态：所有岩点环熄灭，凹槽提示复位 */
function clearSelection(){
  S.selType=null;
  var all=trayNodesOf();
  for(var i=0;i<all.length;i++){
    var n=all[i];
    if(n.__ring)n.__ring.setAttribute("opacity","0");
    n.setAttribute("opacity","1");
  }
  for(var j=0;j<dents.length;j++){
    if(!dents[j].filled&&dents[j].hint)dents[j].hint.setAttribute("opacity",".55");
  }
}
/* 第一步：点脚边岩点 → 只选中（再点同一个取消），不安装 */
function tapTrayHold(node){
  if(S.act!==STORY||S.phase!=="place")return;
  if(!S.pickReady)return;
  var type=node.__type;
  if(S.selType===type){clearSelection();setTip("已取消选择",900);return;}
  clearSelection();
  S.selType=type;
  if(node.__ring)node.__ring.setAttribute("opacity","1");
  /* 让"同形状凹槽"的虚线轮廓脉动一下，明确告诉玩家该点墙上哪里 */
  for(var i=0;i<dents.length;i++){
    if(dents[i].filled||dents[i].t!==type)continue;
    var d=dents[i],st=performance.now();
    (function pulse(){
      var t=(performance.now()-st)/1000;
      if(S.selType!==type||d.filled)return;
      d.hint.setAttribute("opacity",(0.55+Math.sin(t*9)*0.4).toFixed(2));
      requestAnimationFrame(pulse);
    })();
  }
  if(SFX.pop)SFX.pop();
  setTip("已选中「"+TYPES[type].name+"」· 点墙上同形状的凹槽装上去",2400);
}
/* 命中测试：点击是否落在某个墙上凹槽（世界坐标，放大命中半径） */
function dentAt(e){
  var w=climbWorldPt(e),best=-1,bd=86*86;
  for(var i=0;i<dents.length;i++){
    var d=dents[i];if(d.filled)continue;
    var dx=d.x-w.x,dy=d.y-w.y,dd=dx*dx+dy*dy;
    if(dd<bd){bd=dd;best=i;}
  }
  return best;
}
/* 第二步：点墙上凹槽。选中了同形状岩点才装上，否则给错误反馈 */
function tapDent(idx){
  if(S.act!==STORY||S.phase!=="place"||!S.pickReady)return;
  var d=dents[idx];if(!d||d.filled)return;
  if(!S.selType){setTip("先点脚边的岩点选中它，再点凹槽",1600);SFX.wrong();return;}
  if(d.t!==S.selType){
    /* 选错：不消耗岩点、不清除选中，凹槽抖动并提示正确形状 */
    wrongFx(idx,d.t);SFX.wrong();
    setTip("形状对不上：这个凹槽要「"+TYPES[d.t].name+"」",1800);
    return;
  }
  /* 配对成功 */
  var type=S.selType,node=null,all=trayNodesOf();
  for(var i=0;i<all.length;i++)if(all[i].__type===type){node=all[i];break;}
  if(!node)return;
  clearSelection();
  setTapHint("",false);
  S.pickReady=0;S.phase="transition";S.armTarget={x:d.x,y:d.y};
  fillSlot(idx,node);
  var atPlaced=S.placed;
  setTimeout(function(){
    if(S.act!==STORY||S.phase!=="transition")return;
    if(S.placed!==atPlaced)return;
    if(atPlaced>=SLOTS.length){clearProps();startClimb();}
    else{
      S.phase="place";S.pickReady=1;
      setTip("装好 "+S.placed+" / "+SLOTS.length+" · 选下一个岩点",1800);
    }
  },780);
}
/* 凹槽抖动 + 正确位置脉动提示 */
function wrongFx(idx,type){
  var d=dents[idx],x=SLOTS[idx].x,y=SLOTS[idx].y;
  var st=performance.now();
  (function sh(){
    var t=Math.min(1,(performance.now()-st)/340);
    d.g.setAttribute("transform","translate("+(x+Math.sin(t*36)*8).toFixed(1)+","+y+")");
    if(t<1)requestAnimationFrame(sh);
    else{
      d.g.setAttribute("transform","translate("+x+","+y+")");
      d.hint.setAttribute("opacity",".55");
      d.hs.setAttribute("stroke","#FFC24B");
    }
  })();
  var ci=-1;
  for(var i=0;i<SLOTS.length;i++)if(SLOTS[i].t===type)ci=i;
  if(ci<0)return;
  var cd=dents[ci],st2=performance.now();
  (function pd(){
    var t=(performance.now()-st2)/1000;
    if(t>=1){cd.hint.setAttribute("opacity",".55");cd.hs.setAttribute("stroke","#FFC24B");return;}
    cd.hint.setAttribute("opacity",(0.55+Math.sin(t*11)*0.4).toFixed(2));
    requestAnimationFrame(pd);
  })();
}
/* 装上：岩点从脚边跳进凹陷 */
function fillSlot(idx,node){
  var d=dents[idx],sl=SLOTS[idx];
  d.filled=true;S.placed++;
  SFX.place();
  /* 攀爬时仅给下一个可抓岩点显示光圈，光圈不遮挡点击与岩点形状。 */
  d.nextHalo=el("circle",{cx:sl.x,cy:sl.y,r:60,fill:"none",stroke:"#FFF3D0",
    "stroke-width":3.6,"stroke-dasharray":"5 5",opacity:"0","pointer-events":"none"},holdG);
  var wrap=el("g",{transform:"translate("+sl.x+","+sl.y+")"},holdG);
  buildHold(wrap,d.t,false);
  wrap.setAttribute("transform","translate("+sl.x+","+sl.y+") scale(.4)");
  var st=performance.now();
  (function pop(){
    var t=Math.min(1,(performance.now()-st)/340);
    var s=t<1?(0.4+0.60*easeOut(t)):1;
    wrap.setAttribute("transform","translate("+sl.x+","+sl.y+") scale("+s.toFixed(3)+")");
    if(t<1)requestAnimationFrame(pop);
  })();
  d.hint.style.transition="opacity .3s";
  d.hint.setAttribute("opacity","0");
  d.fillNode=wrap;
  burst(sl.x,sl.y,"#fff");
  SFX.cheer();
  if(node&&node.parentNode)node.parentNode.removeChild(node);
  setTip("装好 "+S.placed+" / "+SLOTS.length,1200);
}

/* ==========================================================================
   第三幕：攀岩
   ========================================================================== */
function startClimb(){
  clearBlessings();   /* 攀岩祝福语代际 +1，重开时不残留上一轮气泡 */
  S.act=CLIMB;S.phase="climb";S.step=-1;S.stepDone=0;S.pickReady=0;
  S.girlY=GROUND;S.girlX=206;S.stamina=1;S.timeLeft=HOLD_TIME;
  S.climbElapsed=0;                       /* 展示计时：从 0 开始正计时 */
  $("tnum").textContent="0.00";
  $("tnum").classList.remove("low");
  $("barIn").style.width="0%";
  S.gripping=false;S.gripT=0;S.slipT=0;S.reached=false;
  S.climbTarget=-1;S.climbGoal=false;S.climbT=0;S.climbFrom=null;S.climbTo=null;
  SLOTS.forEach(function(s){s._got=false;});
  clearProps();
  cam.tk=1;
  $("timerRow").classList.add("on");
  /* 攀岩时镜头跟着女生上移，猫会落到画面外；
     把它折进「已跳过」状态，避免半截身体挂在屏幕边缘 */
  S.catVisible=false;
  /* 岩点已全部装进墙里，托盘与图例在攀岩幕收起 */
  trayG.setAttribute("class","stowed");
  $("legend").classList.remove("on");
  setTip("点击上方发光岩点 · 抓住向上，一步一步往上爬",3200);
}
function routeX(y){
  var pts=[{y:GROUND,x:206}];
  SLOTS.forEach(function(s){pts.push({y:s.y,x:s.x});});
  pts.push({y:WIN_Y,x:GOAL.x});
  pts.sort(function(a,b){return a.y-b.y;});
  for(var i=0;i<pts.length-1;i++){
    var a=pts[i],b=pts[i+1];
    if(y>=a.y&&y<=b.y)return lerp(a.x,b.x,(y-a.y)/(b.y-a.y));
  }
  return y<pts[0].y?pts[0].x:pts[pts.length-1].x;
}
function beginClimbMove(i){
  if(S.act!==CLIMB||S.climbTarget>=0||S.climbGoal||S.reached)return;
  if(i!==S.stepDone||i<0||i>=SLOTS.length)return;
  var sl=SLOTS[i];
  S.climbTarget=i;S.climbT=0;S.climbDur=.62;
  S.climbFrom={x:S.girlX,y:S.girlY};
  S.climbTo={x:climbHoldX(i),y:climbHoldY(i)};
  S.armTarget={x:sl.x,y:sl.y};
  S.gripping=true;S.gripT=0;S.pose="climb";
  setTapHint("",false);
}
function beginGoalMove(){
  if(S.act!==CLIMB||S.stepDone<SLOTS.length||S.climbTarget>=0||S.climbGoal||S.reached)return;
  S.climbGoal=true;S.climbT=0;S.climbDur=.7;
  S.climbFrom={x:S.girlX,y:S.girlY};
  S.climbTo={x:GOAL.x,y:WIN_Y};
  S.armTarget={x:GOAL.x,y:GOAL.y};S.pose="climb";
  setTapHint("",false);
}
/* 攀岩祝福语：每抓住一个岩点，就在点旁边冒出一句祝福（5 点对应 5 句）。
   气泡上浮 + 淡出，走完自动移除；blessGen 代际保证攀岩重开时不残留。 */
var BLESSINGS=["天天开心！","吃嘛嘛香~","美美美！！！","心想事成~","顺顺利利~"];
var blessGen=0;
function clearBlessings(){
  blessGen++;
  if(!camG)return;
  var olds=camG.querySelectorAll("g[data-bless]");
  for(var i=olds.length-1;i>=0;i--)if(olds[i].parentNode)olds[i].parentNode.removeChild(olds[i]);
}
function showBlessing(i,x,y){
  var gen=blessGen;
  var side=x>GOAL.x?-1:1;                      /* 朝画面中央展开，避免祝福语出画 */
  var bx=x+side*118;
  /* 必须挂在 camG（世界坐标）：fxG 在 root 空间无相机变换，攀岩时相机上移，
     前三个岩点的世界 y（1560/1300/1040）会落到屏幕外，只剩最后两个看得见。 */
  var g=el("g",{"data-bless":"1",transform:"translate("+bx.toFixed(1)+","+y.toFixed(1)+")",
    style:"pointer-events:none"},camG);
  var txt=BLESSINGS[i%BLESSINGS.length];
  /* 不要矩形框：纯卡通圆润字体 + 深色描边，在墙面上清晰又轻盈 */
  var t=el("text",{x:0,y:0,"font-size":"25","font-weight":"900",fill:"#FFE9A8",
    stroke:"#3a1f5e","stroke-width":6,"paint-order":"stroke","stroke-linejoin":"round",
    "stroke-linecap":"round","text-anchor":"middle",
    "font-family":"'Comic Sans MS','Yuanti SC','幼圆','Microsoft YaHei',cursive"},g);
  t.textContent=txt;
  var st=performance.now(),dur=2000;
  (function a(){
    if(gen!==blessGen){if(g.parentNode)g.parentNode.removeChild(g);return;}
    var p=(performance.now()-st)/dur;
    if(p>=1){if(g.parentNode)g.parentNode.removeChild(g);return;}
    var rise=Math.min(1,p*2.4);                       /* 前段快速上浮 */
    var fade=p<0.68?1:1-(p-0.68)/0.32;               /* 后段淡出 */
    g.setAttribute("transform","translate("+bx.toFixed(1)+","+(y-rise*26).toFixed(1)+")");
    g.setAttribute("opacity",fade.toFixed(2));
    requestAnimationFrame(a);
  })();
}
/* 抓到岩点：只给一次「抓住」反馈并计入进度，随后停在岩点上等待下一次抓握。
   五段任务关卡暂时停用（保留 enterStep 等实现，日后可一键恢复），
   现在攀岩是一口气逐点抓握到顶，不被弹窗打断、倒计时也不暂停。 */
function triggerClimbStep(i){
  var sl=SLOTS[i],t=TYPES[sl.t];
  sl._got=true;
  S.stepDone=i+1;
  S.stamina=Math.min(1,S.stamina+t.stam);
  S.girlY=climbHoldY(i);S.girlX=climbHoldX(i);
  S.armTarget={x:sl.x,y:sl.y};
  S.pose="climb";S.hangT=0;
  SFX.grab();burst(sl.x,sl.y,t.light);
  showBlessing(i,sl.x,sl.y-30);
  setTip("抓住「"+t.name+"」 · "+(i+1)+" / "+SLOTS.length+
    (S.stepDone>=SLOTS.length?" · 点红色终点完成登顶":" · 继续抓上方发光岩点"),1700);
}
function updateNextHalo(){
  var pulse=.55+Math.sin(now()*5)*.25;
  for(var i=0;i<dents.length;i++){
    var h=dents[i].nextHalo;if(!h)continue;
    var active=S.act===CLIMB&&i===S.stepDone&&S.climbTarget<0&&!S.climbGoal&&!S.reached;
    h.setAttribute("opacity",active?pulse.toFixed(2):"0");
    h.setAttribute("r",(60+Math.sin(now()*5)*4).toFixed(1));
  }
}
function updateClimb(dt){
  updateNextHalo();
  if(S.girlY<=WIN_Y&&S.stepDone>=SLOTS.length){
    if(!S.reached){
      S.reached=true;S.pose="idle";
      freezeClimbClock();
      setTip("点一下红色终点 · 完成登顶",3000);
      SFX.pop();
    }
    S.girlX=lerp(S.girlX,GOAL.x,0.1);
    return;
  }
  S.timeLeft-=dt;                 /* 内部仍走递减：保留超时失败判定，测试链路不变 */
  S.climbElapsed=(S.climbElapsed||0)+dt;   /* 展示用正计时：从 0 开始一直往上加 */
  $("tnum").textContent=Math.min(S.climbElapsed,11.25).toFixed(2);
  $("tnum").classList.remove("low");
  $("barIn").style.width=(Math.min(S.climbElapsed,11.25)/11.25*100).toFixed(1)+"%";
  if(S.timeLeft<=0){endFail();return;}

  /* 不点不动。点击正确岩点后，才播放一段伸手抓握 → 拉身 → 蹬腿上升。 */
  if(S.climbTarget>=0||S.climbGoal){
    var isGoal=S.climbGoal,idx=S.climbTarget;
    S.climbT=clamp(S.climbT+dt/S.climbDur,0,1);
    var e=easeInOut(S.climbT);
    S.girlX=lerp(S.climbFrom.x,S.climbTo.x,e);
    S.girlY=lerp(S.climbFrom.y,S.climbTo.y,e)-Math.sin(S.climbT*Math.PI)*12;
    S.pose="climb";S.wob=(S.wob||0)+dt*8;
    if(S.climbT>=1){
      S.girlX=S.climbTo.x;S.girlY=S.climbTo.y;
      S.climbTarget=-1;S.climbGoal=false;S.climbFrom=null;S.climbTo=null;
      S.gripping=false;S.gripT=0;S.armTarget=null;
      if(isGoal){
        S.reached=true;S.pose="idle";SFX.pop();
        freezeClimbClock();
        setTip("点一下红色终点 · 完成登顶",3000);
      }else{
        triggerClimbStep(idx);
      }
    }
    return;
  }

  /* 等待下一次抓握：挂在刚抓到的岩点上（手臂扶着点），不自动上升、
     也不因松手下滑。没有任务弹窗打断，倒计时持续走。 */
  if(S.stepDone>0&&S.stepDone<=SLOTS.length){
    var last=SLOTS[S.stepDone-1];
    S.armTarget={x:last.x,y:last.y};
    S.pose="climb";
    S.wob=(S.wob||0)+dt*4;
  }else{
    S.pose="idle";S.armTarget=null;
  }
}
/* 登顶定格：无论实际攀了几秒，展示计时最终都锁在 11.25 */
function freezeClimbClock(){
  $("tnum").textContent="11.25";
  $("barIn").style.width="100%";
  $("tnum").classList.remove("low");
}
function endFail(){
  S.act=FAIL;SFX.slip();
  $("failModal").classList.add("on");
  setTapHint("",false);
}

/* 登顶工作台镜头：以峰顶平台为基准，把角色和道具放在画面中下部 */
function aimAfter(k,cx,anchor,wy){

}
/* 登顶后的阁楼室内：斜屋顶 + 木梁 + 圆窗月光 + 木地板。
   画在 afterG 里覆盖住外景（夜空/墙），营造温暖的手作阁楼氛围。 */
function buildSummit(){
  var g=afterG, cx=GOAL.x+70, fy=GOAL.y;  /* 镜头焦点与地板线 */
  /* 室内墙面（暖棕木板），覆盖整个可视区 */

  for(var px=cx-560;px<cx+560;px+=56){
    el("rect",{x:px+2,y:fy-520,width:52,height:900,fill:(Math.round((px-cx)/56)%2?"#412f26":"#3a2b24")},g);

/* 分步真实操作：①点布料选中 → ②点缝纫机(女孩走到机器前坐下、布料上台)
   → ③点踏板(踩下启动，轮转针动逐针缝合) → 完成。
   兼容旧测试：afterPt('fabric'/'machine')、afterDo('sew') 仍有效。 */
function tapSewFinal(e){
  if(S.act!==SEW||S.sewStage===3)return;
  var w=climbWorldPt(e),fp=fabricPt(),mp=sewMachinePt(),pp=pedalPt();
  if(S.sewStage===0){
    var dx=w.x-fp.x,dy=w.y-fp.y;
    if(dx*dx+dy*dy<78*78){
      S.fabricPicked=true;S.sewStage=1;SFX.pick();
      if(STORY_PROPS.fabricSel)STORY_PROPS.fabricSel.setAttribute("opacity","1");
      setTapHint("② 点缝纫机",true);
    }else{ SFX.wrong();setTip("先点粉色布料",1800); }
    return;
  }
  if(S.sewStage===1){
    var dmx=w.x-mp.x,dmy=w.y-mp.y;
    if(dmx*dmx+dmy*dmy<80*80){
      S.sewStage=2;
      if(STORY_PROPS.fabricSel)STORY_PROPS.fabricSel.setAttribute("opacity","0");
      /* 女孩走到缝纫机前坐下操作 */
      S.pose="sew";
      moveGirlTo(SEW_CX-64,GOAL.y,0.6);
      /* 布料从布堆移到机器针下 */
      var top=$("fabricTop");
      if(top){top.setAttribute("transform","translate(-92,34)");}
      SFX.pick();
      setTapHint("③ 踩踏板启动",true);
      if(STORY_PROPS.pedalBg)STORY_PROPS.pedalBg.setAttribute("fill","#FFC24B");
    }else{ SFX.wrong();setTip("点缝纫机，把布料放上去",1800); }
    return;
  }
  if(S.sewStage===2){
    var dpx=w.x-pp.x,dpy=w.y-pp.y;
    if(dpx*dpx+dpy*dpy<70*70){
      S.sewStage=3;S.sewT=1.6;S.sewStartAt=now();S.sewDone=false;
      SFX.sewStart&&SFX.sewStart();
      setTip("她踩着踏板，缝纫机哒哒哒…",1800);setTapHint("",false);
      if(STORY_PROPS.pedal)STORY_PROPS.pedal.setAttribute("transform","translate(-6,-10) rotate(-8)");
      /* 不依赖 rAF：低帧率下也能推进到下一步（sewDone 幂等守卫） */
      setTimeout(function(){if(S.act===SEW&&!S.sewDone)finishSew();},1700);
    }else{ SFX.wrong();setTip("踩一下缝纫机踏板（机器下方）",1800); }
  }
}
/* 女孩补间走到目标站位（只改 girlX，y 保持在地板） */
function moveGirlTo(tx,ty,dur){
  var st=performance.now(),sx=S.girlX;
  (function a(){
    var t=clamp((performance.now()-st)/(dur*1000),0,1);
    S.girlX=lerp(sx,tx,easeInOut(t));
    if(t<1)requestAnimationFrame(a);
  })();
}
function updateSewFinal(dt){
  if(S.sewStage===3&&S.sewT>0){
    /* 用真实经过时间算进度，避免主循环把 dt 钳到 50ms 后，
       低帧率下缝纫被拖慢数倍（测试连跑多个机型时曾因此超时）。 */
    S.sewProg=clamp((now()-S.sewStartAt)/1.6,0,1);
    var n=STORY_PROPS.needle;
    if(n)n.setAttribute("transform","translate(-6,"+(-90+(Math.abs(Math.sin(now()*18))>.5?4:0))+")");
    var wh=STORY_PROPS.wheel;
    if(wh)wh.setAttribute("transform","translate(-52,-92) rotate("+((now()*600)%360).toFixed(0)+")");
    if(Math.random()<dt*9&&SFX.stitch)SFX.stitch();

    if(k>S.sewStitch){

function finishSew(){

/* ---------- ③ 布料音符 → 五线谱 → 生日快乐歌 ---------- */
function startNotes(){
  S.act=NOTES;clearProps();

function noteLabelStyle(size,fill){
  return {"text-anchor":"middle","font-size":size,"font-weight":"bold",fill:fill};
}
/* 波浪五线谱：5 条平行正弦曲线，替代笔直的直线。
   cx=谱面水平中心, top=最上一条线的 y, w=半宽, amp=波幅。 */
function waveStaff(g,cx,top,w,amp,phase){
  for(var l=0;l<5;l++){
    var y0=top+l*15, d="", step=8;
    for(var xx=-w;xx<=w+step;xx+=step){
      var x=Math.min(xx,w);
      var y=y0+Math.sin(x/46+phase+l*0.35)*amp;
      d+=(xx===-w?"M":"L")+(cx+x).toFixed(1)+","+y.toFixed(1);
      if(x===w)break;
    }
    el("path",{d:d,fill:"none",stroke:"rgba(255,255,255,.42)","stroke-width":1.5},g);
  }
}
function buildMusic(){
  var g=el("g",{id:"musicProp"},propG),base=GOAL.y;
  var winX=GOAL.x-80, winY=base-250;   /* 圆窗中心（与 buildSummit 一致） */
  /* 一段五线谱：挪到圆窗右侧（参考图蓝框），与圆窗同高、向右铺开。
     单段 6 槽，槽间距 42（> 命中直径 38），半宽 118 覆盖 5*42+余量。 */
  var seg={cx:winX+186, top:winY-30, w:118, amp:6, phase:0.6};
  waveStaff(g,seg.cx,seg.top,seg.w,seg.amp,seg.phase);
  el("text",{x:seg.cx,y:seg.top-24,"font-size":"26",fill:"#FFE9A8","text-anchor":"middle"},g).textContent="♪";
  noteSlots=[];notePieces=[];
  /* 6 个音符槽：沿波浪线错落起伏（音名越高越靠上） */
  BDAY.forEach(function(n,i){
    var x=seg.cx-seg.w+18+i*42;                       /* 段内间距 42（> 命中直径 38） */
    var wave=Math.sin((x-seg.cx)/46+seg.phase+(n.p.charCodeAt(0)%3)*0.35)*seg.amp;
    var y=seg.top+58+(n.y+205)*0.62+wave;             /* 音高越高越靠上，幅度收在谱带内 */
    var sg=el("g",{id:"noteSlot"+i,transform:"translate("+x.toFixed(1)+","+y.toFixed(1)+")",style:"cursor:pointer"},g);
    el("ellipse",{cx:0,cy:0,rx:14,ry:11,fill:"rgba(255,194,75,.12)",stroke:"#FFC24B",
      "stroke-width":2.4,"stroke-dasharray":"5 5"},sg);
    var tx=el("text",Object.assign({x:0,y:5},noteLabelStyle(13,"#FFE9A8")),sg);tx.textContent=n.p;
    el("circle",{cx:0,cy:0,r:22,fill:"transparent"},sg);
    noteSlots.push({x:x,y:y,p:n.p,node:sg,filled:false,fixed:null});
  });
  /* 待放布条：6 个错落在女孩左右两侧地面（各 3 个），正对参考图红框区域。
     女孩站在 GOAL.x，布条分列其左右、纵向铺在脚下到小腿高度，不遮挡身体。 */
  NOTE_ORDER.forEach(function(mi,i){
    var n=BDAY[mi];
    var left=i<3, k=i%3;
    var baseX=left?(GOAL.x-135):(GOAL.x+135);
    var x=baseX+(k%2?14:-10)+Math.sin(k*1.7)*8;    /* 左右轻微参差 */
    var y=base-168+k*58+(left?0:18)+Math.cos(k*1.3)*8; /* 铺在女孩两侧身高范围，不落到地板下 */
    var pg=el("g",{id:"notePiece"+i,transform:"translate("+x.toFixed(1)+","+y.toFixed(1)+")",style:"cursor:pointer"},g);
    var ring=el("circle",{cx:0,cy:-4,r:24,fill:"none",stroke:"#FFF3D0","stroke-width":3,
      "stroke-dasharray":"5 6",opacity:"0","pointer-events":"none"},pg);
    el("ellipse",{cx:0,cy:0,rx:12,ry:9,transform:"rotate(-20)",fill:"#FF8FA3",
      stroke:"#C24E7C","stroke-width":2},pg);
    el("path",{d:"M10,-2 L10,-30 q10,4 10,14",stroke:"#FF8FA3","stroke-width":4,
      fill:"none","stroke-linecap":"round"},pg);
    var t=el("text",Object.assign({x:0,y:4},noteLabelStyle(11,"#fff")),pg);t.textContent=n.p;

var smokeGen=0;
function clearFxSmoke(){

  var all=fxG.querySelectorAll("circle");

    if(/rgba\(255,\s*255,\s*255/.test(f)&&all[i].parentNode)all[i].parentNode.removeChild(all[i]);
  }
}
function puffAt(x,y){
  var gen=smokeGen;
  for(var i=0;i<8;i++){
    var c=el("circle",{cx:x,cy:y,r:2+Math.random()*3,fill:"rgba(255,255,255,.75)"},fxG);
    var a=Math.random()*Math.PI*2,sp=30+Math.random()*70;
    var vx=Math.cos(a)*sp,vy=Math.sin(a)*sp-30,life=0;
    (function pl(){
      if(gen!==smokeGen||!c.parentNode)return;   /* 幕切换或已被清 → 直接停 */
      life+=.03;
      c.setAttribute("cx",(x+vx*life).toFixed(1));
      c.setAttribute("cy",(y+vy*life+life*life*40).toFixed(1));
      c.setAttribute("opacity",Math.max(0,1-life/1.1).toFixed(2));
      if(life<1.1)requestAnimationFrame(pl);
      else if(c.parentNode)c.parentNode.removeChild(c);
    })();
  }
}

/* 玫瑰千层蛋糕（参考 Mofei's Bakery）：粉绿相间的千层侧面 + 粉色玫瑰裱花

function cakeRoseMarkup(o){
  var rx=o.rx, bodyH=o.bodyH, ry=o.ry||Math.round(rx*0.34), uid=o.uid||"cake";
  var bands=["#FBE7EC","#EEA6BB","#FFF4E9","#D5E4A6","#FFF4E9","#EC9FB6","#FFF4E9","#CCDF98","#F7E3EA"];
  var s=[];
  s.push('<defs>'+
    '<clipPath id="cakeClip'+uid+'"><path d="M'+(-rx)+',0 L'+(-rx)+','+bodyH+' A'+rx+','+ry+' 0 0 0 '+rx+','+bodyH+' L'+rx+',0 Z"/></clipPath>'+
    '<linearGradient id="cakeShade'+uid+'" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0" stop-color="#5A3A48" stop-opacity=".28"/><stop offset=".18" stop-color="#5A3A48" stop-opacity="0"/>'+
      '<stop offset=".82" stop-color="#5A3A48" stop-opacity="0"/><stop offset="1" stop-color="#5A3A48" stop-opacity=".32"/>'+
    '</linearGradient>'+
    '<linearGradient id="cakeGold'+uid+'" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="#FBE7AC"/><stop offset=".5" stop-color="#E8C46B"/><stop offset="1" stop-color="#C79A40"/>'+
    '</linearGradient></defs>');
  /* 侧面千层：每条横带的上下缘都是与顶部椭圆前缘相同的下凹弧（sweep 左→右 0 / 右→左 1） */
  var bh=bodyH/bands.length;
  for(var i=0;i<bands.length;i++){
    var y1=i*bh, y2=(i+1)*bh;
    s.push('<path d="M'+(-rx)+','+y1.toFixed(1)+
      ' A'+rx+','+ry+' 0 0 0 '+rx+','+y1.toFixed(1)+
      ' L'+rx+','+y2.toFixed(1)+
      ' A'+rx+','+ry+' 0 0 1 '+(-rx)+','+y2.toFixed(1)+' Z" fill="'+bands[i]+'"/>');
  }
  /* 圆柱左右明暗：同形弧带覆盖整个侧面 */
  s.push('<path d="M'+(-rx)+',0 A'+rx+','+ry+' 0 0 0 '+rx+',0 L'+rx+','+bodyH+
    ' A'+rx+','+ry+' 0 0 1 '+(-rx)+','+bodyH+' Z" fill="url(#cakeShade'+uid+')"/>');
  s.push('<path d="M'+(-rx)+','+bodyH+' A'+rx+','+ry+' 0 0 0 '+rx+','+bodyH+'" fill="none" stroke="#CBAE93" stroke-width="1.2" opacity=".55"/>');
  /* 顶面奶油 + 双螺旋玫瑰裱花 */
  s.push('<ellipse cx="0" cy="0" rx="'+rx+'" ry="'+ry+'" fill="#FDEDF0"/>');
  function spiral(phase){
    var pts=[],N=Math.PI*4.4;
    for(var t=0;t<=N;t+=0.2){
      var rr=rx*0.84*(1-t/N*0.82);
      pts.push((Math.cos(t+phase)*rr).toFixed(1)+","+(Math.sin(t+phase)*rr*(ry/rx)).toFixed(1));
    }
    return "M"+pts.join(" L");
  }
  s.push('<path d="'+spiral(0)+'" fill="none" stroke="#E9A3BA" stroke-width="'+(rx*0.1).toFixed(1)+'" stroke-linecap="round"/>');
  s.push('<path d="'+spiral(Math.PI)+'" fill="none" stroke="#F8D3DF" stroke-width="'+(rx*0.075).toFixed(1)+'" stroke-linecap="round"/>');
  s.push('<ellipse cx="0" cy="0" rx="'+(rx*0.13).toFixed(1)+'" ry="'+(ry*0.16).toFixed(1)+'" fill="#E994B2"/>');
  /* 干玫瑰花瓣 */
  var petals=[[-2.7,.74,2.4,0],[.35,.79,2.1,1],[2.5,.72,2.6,2],[-1.5,.83,1.9,3],[1.6,.7,2.3,1],
              [-.4,.86,2,0],[3.0,.62,2.2,2],[-2.0,.6,1.8,3],[.9,.88,2,1],[-1.0,.55,1.7,0],[2.0,.85,2.1,2],[-3.0,.8,1.9,3]];
  var pcols=["#9C2F63","#B23A72","#C95386","#8E2C5C"];
  petals.forEach(function(p){
    var x=(Math.cos(p[0])*rx*p[1]).toFixed(1), y=(Math.sin(p[0])*ry*p[1]).toFixed(1);
    s.push('<ellipse cx="'+x+'" cy="'+y+'" rx="'+(p[2]*1.5).toFixed(1)+'" ry="'+(p[2]*0.7).toFixed(1)+'" fill="'+pcols[p[3]]+'" transform="rotate('+(p[0]*57).toFixed(0)+' '+x+' '+y+')" opacity=".92"/>');
  });

  function rnd(n){var x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);}
  for(var k=0;k<16;k++){
    var a=rnd(k+1)*Math.PI*2, rf=0.42+rnd(k+21)*0.46;
    var x=(Math.cos(a)*rx*rf).toFixed(1), y=(Math.sin(a)*ry*rf).toFixed(1);
    s.push('<ellipse cx="'+x+'" cy="'+y+'" rx="'+(1+rnd(k+41)*0.9).toFixed(1)+'" ry="'+(0.8+rnd(k+61)*0.6).toFixed(1)+'" fill="'+(k%2?"#F0D98A":"#E4BE63")+'"/>');
  }
  /* 中央金色铭牌 */
  s.push('<ellipse cx="0" cy="0" rx="'+(rx*0.34).toFixed(1)+'" ry="'+(ry*0.44).toFixed(1)+'" fill="url(#cakeGold'+uid+')" stroke="#B98C39" stroke-width="1"/>');
  s.push('<ellipse cx="0" cy="0" rx="'+(rx*0.29).toFixed(1)+'" ry="'+(ry*0.36).toFixed(1)+'" fill="none" stroke="#F6E3AE" stroke-width=".8" opacity=".9"/>');
  if(o.plaqueText)
    s.push('<text x="0" y="'+(ry*0.08).toFixed(1)+'" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="'+(rx*0.11).toFixed(1)+'" fill="#6E4A20">'+o.plaqueText+'</text>');
  return s.join("");
}

      d.style.opacity=(0.5-t*0.5).toFixed(2);
      requestAnimationFrame(go);
    })();
  }
}

var FX={ctx:null,w:0,h:0,parts:[]};
function fxLoop(dt){
  var c=FX.ctx;if(!c)return;
  c.clearRect(0,0,FX.w,FX.h);
  for(var i=FX.parts.length-1;i>=0;i--){
    var p=FX.parts[i];p.life+=dt;
    if(p.t==="c"){
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      if(p.y>FX.h+40){FX.parts.splice(i,1);continue;}
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);
      c.fillStyle=p.c;
      c.globalAlpha=p.y>FX.h-130?Math.max(0,(FX.h-p.y)/130):1;
      c.fillRect(-p.w/2,-p.h/2,p.w,p.h*(0.5+Math.abs(Math.sin(p.life*3))*0.5));
      c.restore();
    }else{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.vx*=0.985;p.vy*=0.985;
      if(p.life>2.2){FX.parts.splice(i,1);continue;}
      c.globalAlpha=Math.max(0,1-p.life/2.2);
      c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,6.3);c.fill();
    }
  }
  c.globalAlpha=1;
}
function confetti(n){
  var cols=["#FFC24B","#FF7A5C","#4FD1C5","#B794F6","#FF6FA5","#FFF3D0","#8CFFC4"];
  for(var i=0;i<(n||60);i++)FX.parts.push({t:"c",x:Math.random()*FX.w,y:-24-Math.random()*FX.h*.7,
    vx:(Math.random()-.5)*1.3,vy:1.3+Math.random()*2.3,w:5+Math.random()*7,h:8+Math.random()*10,
    rot:Math.random()*6.28,vr:(Math.random()-.5)*.22,c:cols[i%cols.length],life:0});
}
function fireworks(){
  var cols=["#FFC24B","#FF7A5C","#4FD1C4","#B794F6","#FF6FA5","#FFF3D0"];
  for(var k=0;k<4;k++){
    (function fire(k){
      setTimeout(function(){
        var cx=FX.w*(0.2+Math.random()*0.6),cy=FX.h*(0.22+Math.random()*0.34);
        for(var i=0;i<48;i++){
          var a=i/48*Math.PI*2+Math.random()*.2,sp=1.5+Math.random()*3.4;
          FX.parts.push({t:"f",x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
            c:cols[i%cols.length],r:2+Math.random()*2.1,life:0});
        }
        tone(500+Math.random()*420,.5,"sine",.055,120);
      },k*400);
    })(k);
  }
}

function resize(){
  var r=scene.getBoundingClientRect();
  var w=r.width||400,h=r.height||H;
  /* viewBox 高度跟随视口比例，保证内容填满而非等比缩小留白。
     若固定 760 配 xMidYMid meet，窄高屏会等比缩小并垂直居中，
     底部岩点筐就会被推到屏幕外。
     上限 900：再高会把岩点筐压得过小（点击目标 <44px 就不好点了）。 */
  var VBH=clamp(H*(h/w),H,900);
  var VBW=clamp(W*(w/h),W,1150);
  scene.setAttribute("viewBox","0 0 "+VBW.toFixed(0)+" "+VBH.toFixed(0));
  /* 用 meet 保住全部内容（不裁左右）；viewBox 变高后由 extendStage 补背景 */
  scene.setAttribute("preserveAspectRatio","xMidYMid meet");
  root.setAttribute("transform","translate("+((VBW-W)/2).toFixed(1)+",0)");
  var cv=$("fx"),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.floor(w*dpr));cv.height=Math.max(1,Math.floor(h*dpr));
  FX.ctx=cv.getContext("2d");
  FX.ctx.setTransform(dpr,0,0,dpr,0,0);
  FX.w=w;FX.h=h;
  extendStage(VBH);
  VIEW_H=VBH;
  /* 托盘挂在 camG 里（世界空间），纵向由 followTray 跟随女生，
     resize 只需在托盘为空时建一次，不要动它的 transform。 */
  if(trayG&&!trayG.firstChild)buildTray();
  var to=(S.act===CLIMB||S.act===FAIL||S.act===SHOWBOW||(S.act>=SEW&&S.act<=PARADE))?1:OV_K;
  cam.tx=200-S.girlX*to;
}

/* viewBox 变高时延伸夜空与地面，避免下方露出空白 */
function extendStage(VBH){
  if(!skyBg)return;
  /* viewBox 变高时把夜空与地面一起拉长，避免下方露出 body 的纯黑底。
     额外多补 260：镜头会把人物放在 0.62 屏高处，下方需要足够多的地面。 */
  var extra=Math.max(0,VBH-H)+260;
  skyBg.setAttribute("height",(GROUND+760+extra).toFixed(0));
  if(groundFill)groundFill.setAttribute("height",(420+extra).toFixed(0));
  if(groundLip){
    var bottom=(GROUND+420+extra).toFixed(0);
    groundLip.setAttribute("d","M-700,"+GROUND+
      " q150,-14 300,0 q150,12 300,-2 q150,-14 300,2 q150,12 300,-4 q150,-14 300,2"+
      " L1000,"+bottom+" L-700,"+bottom+" Z");
  }
}

function tapClimb(e){
  if(S.reached){doWin();return;}
  if(S.climbTarget>=0||S.climbGoal)return;
  var w=climbWorldPt(e);
  if(S.stepDone>=SLOTS.length){
    var gx=w.x-GOAL.x,gy=w.y-GOAL.y;
    if(gx*gx+gy*gy<92*92)beginGoalMove();
    else setTip("点红色终点，完成最后一步",1400);
    return;
  }
  var idx=S.stepDone,sl=SLOTS[idx];
  var dx=w.x-sl.x,dy=w.y-sl.y;
  if(dx*dx+dy*dy<78*78){beginClimbMove(idx);return;}
  /* 不允许越过当前岩点直接抓更高处，也不把空白处当成自动上升按钮。 */
  SFX.wrong();
  setTip("先抓上方发光的「"+TYPES[sl.t].name+"」岩点 · 一步一步向上",1600);
}
